<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Audio Remote Controller - Real P2P</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS untuk Koneksi Lintas Kota -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* Desain Hardware Pro Audio 3D (Skeuomorphism) */
        .mixer-panel {
            background: linear-gradient(145deg, #0f172a, #020617);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            border: 2px solid #1e293b;
        }
        .btn-3d {
            background: linear-gradient(145deg, #334155, #1e293b);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid #475569;
            transition: all 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(2px);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .knob-3d {
            width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #475569, #0f172a);
            box-shadow: 4px 4px 10px #000000, -2px -2px 6px #334155, inset 0 2px 3px rgba(255,255,255,0.2);
            position: relative; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .knob-indicator {
            width: 3px; height: 16px; background: #38bdf8;
            position: absolute; top: 4px; border-radius: 2px;
            box-shadow: 0 0 6px #38bdf8;
            transform-origin: bottom center;
            bottom: 50%; left: calc(50% - 1.5px);
        }
        .fader-track {
            height: 130px; width: 14px; background: #020617;
            border-radius: 7px; box-shadow: inset 3px 3px 6px #000000, inset -1px -1px 2px #334155;
            position: relative; margin: 0 auto;
        }
        .fader-handle {
            height: 36px; width: 28px; background: linear-gradient(145deg, #f59e0b, #d97706);
            border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.4);
            position: absolute; left: -7px; top: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .fader-handle::after {
            content: ''; width: 16px; height: 2px; background: #451a03;
        }
        .monitor-glass {
            background: #000; border: 6px solid #1e293b; border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 15px rgba(56, 189, 248, 0.15);
            position: relative; overflow: hidden;
        }
        .led-indicator {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ef4444; box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s ease;
        }
        .led-active {
            background: #22c55e; box-shadow: 0 0 12px #22c55e;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- RACK UTAMA AUDIO CONTROLLER -->
    <div class="mixer-panel w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-5">
        
        <!-- HEADER RAC_RACK STYLE -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h1 class="text-sm font-black tracking-wider text-cyan-400 uppercase">PRO AUDIO DLMS-LINK</h1>
                <p class="text-[9px] text-slate-500">P2P Remote Master & Slave System</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                <span id="hardware-status-text" class="text-[10px] font-mono text-red-400">OFFLINE</span>
                <div id="hardware-led" class="led-indicator"></div>
            </div>
        </div>

        <!-- VIEW 1: PILIH PERANGKAT (HOME) -->
        <div id="view-home" class="space-y-4 text-center py-6">
            <div class="space-y-1">
                <h2 class="text-lg font-bold text-slate-200">Pilih Mode Perangkat</h2>
                <p class="text-xs text-slate-400">Tentukan peran HP ini dalam sistem transmisi jarak jauh.</p>
            </div>
            <div class="grid grid-cols-2 gap-4 pt-4">
                <button onclick="selectRole('sender')" class="btn-3d p-5 rounded-xl flex flex-col items-center justify-center gap-2 group">
                    <span class="text-3xl">🎛️</span>
                    <span class="text-xs font-bold text-cyan-300 group-hover:text-white">HP 1: KONTROLER</span>
                    <span class="text-[9px] text-slate-400">Kirim YT, File, & Perintah</span>
                </button>
                <button onclick="selectRole('receiver')" class="btn-3d p-5 rounded-xl flex flex-col items-center justify-center gap-2 group">
                    <span class="text-3xl">🔊</span>
                    <span class="text-xs font-bold text-emerald-300 group-hover:text-white">HP 2: PLAYER</span>
                    <span class="text-[9px] text-slate-400">Penerima & Output Sound</span>
                </button>
            </div>
        </div>

        <!-- VIEW 2: HP 1 KONTROLER (MASTER) -->
        <div id="view-sender" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                <div>
                    <span class="text-[9px] text-slate-400 block">KODE KONEKSI AKTIF:</span>
                    <span id="sender-code" class="text-xl font-mono font-black text-yellow-400 tracking-widest">MEMUAT...</span>
                </div>
                <button onclick="location.reload()" class="text-[10px] bg-red-500/20 text-red-400 px-2.5 py-1 rounded border border-red-500/30">Reset</button>
            </div>

            <!-- Panel Kontrol Fisik Simulasi 3D -->
            <div class="grid grid-cols-3 gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-800/80 items-center">
                <div class="flex flex-col items-center">
                    <span class="text-[9px] text-slate-400 mb-1">POTENSIO MASTER</span>
                    <div class="knob-3d" id="knob-master" onclick="rotateKnob()">
                        <div class="knob-indicator" id="knob-ind" style="transform: rotate(-45deg);"></div>
                    </div>
                </div>
                <div class="col-span-2 flex justify-around items-center">
                    <div class="text-center">
                        <span class="text-[9px] text-slate-400 block mb-1">FADER CH 1</span>
                        <div class="fader-track" id="fader-track-1">
                            <div class="fader-handle" id="fader-1" style="top: 30%;"></div>
                        </div>
                    </div>
                    <div class="text-center">
                        <span class="text-[9px] text-slate-400 block mb-1">FADER CH 2</span>
                        <div class="fader-track" id="fader-track-2">
                            <div class="fader-handle" id="fader-2" style="top: 50%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Media YouTube & Lokal -->
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-300 block mb-1 font-semibold">STREAM YOUTUBE URL:</label>
                    <div class="flex gap-2">
                        <input type="text" id="yt-url" placeholder="https://youtube.com/watch?v=..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-cyan-500 font-mono">
                        <button onclick="sendYouTube()" class="btn-3d px-4 py-2 rounded-lg text-xs font-bold text-cyan-300">STREAM</button>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] text-slate-300 block mb-1 font-semibold">UPLOAD FILE AUDIO/VIDEO LOKAL:</label>
                    <input type="file" id="local-file" accept="audio/*,video/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-slate-800 file:text-cyan-300 hover:file:bg-slate-700 cursor-pointer border border-slate-800 rounded-lg bg-slate-950 p-1">
                </div>

                <!-- Tombol Play / Pause Utama -->
                <div class="flex gap-2 pt-1">
                    <button onclick="sendCommand('play')" class="btn-3d flex-1 bg-emerald-600/30 text-emerald-300 py-2.5 rounded-lg text-xs font-black tracking-wider">▶ PLAY</button>
                    <button onclick="sendCommand('pause')" class="btn-3d flex-1 bg-amber-600/30 text-amber-300 py-2.5 rounded-lg text-xs font-black tracking-wider">⏸ PAUSE</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: HP 2 PENERIMA / PLAYER (SLAVE) -->
        <div id="view-receiver" class="hidden space-y-4">
            <div class="space-y-1.5">
                <label class="text-[10px] text-slate-300 block font-semibold">MASUKKAN KODE DARI HP 1:</label>
                <div class="flex gap-2">
                    <input type="text" id="input-code" placeholder="KODE 4-DIGIT" maxlength="4" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono tracking-widest text-center uppercase focus:outline-none focus:border-emerald-500 text-yellow-400 font-bold">
                    <button onclick="connectToSender()" class="btn-3d px-4 py-2 rounded-lg text-xs font-bold text-emerald-300 bg-emerald-900/40">LINK</button>
                </div>
            </div>

            <!-- Tombol Pairing Bluetooth Audio -->
            <div>
                <button onclick="requestBluetooth()" class="btn-3d w-full bg-blue-900/30 border border-blue-500/40 text-blue-300 text-xs py-2 rounded-lg font-medium flex items-center justify-center gap-2">
                    🎧 PAIR SPEAKER BLUETOOTH EKSTERNAL
                </button>
            </div>

            <!-- Monitor Layar Visualisasi Video / Media -->
            <div class="monitor-glass aspect-video flex items-center justify-center">
                <div id="player-placeholder" class="text-xs text-slate-600 font-mono tracking-widest">NO SIGNAL INPUT</div>
                <div id="yt-player-container" class="w-full h-full hidden absolute inset-0"></div>
                <video id="audio-video-player" class="w-full h-full hidden absolute inset-0 object-contain" controls playsinline></video>
            </div>
            
            <button onclick="location.reload()" class="w-full text-[10px] text-slate-500 hover:text-slate-300 py-1">Putus / Kembali ke Menu</button>
        </div>

    </div>

    <footer class="text-slate-600 text-[9px] mt-4 text-center font-mono">
        SYSTEM STATUS: P2P SOCKET READY • 2026 PRO AUDIO ARCHITECTURE
    </footer>

    <!-- SCRIPT UTAMA KODE NYATA -->
    <script>
        let peer, conn;
        let myId = Math.floor(1000 + Math.random() * 9000).toString();
        let ytPlayer = null;

        function selectRole(role) {
            document.getElementById('view-home').classList.add('hidden');
            if (role === 'sender') {
                document.getElementById('view-sender').classList.remove('hidden');
                initSender();
            } else {
                document.getElementById('view-receiver').classList.remove('hidden');
            }
        }

        // --- INISIALISASI HP 1 (MASTER KONTROLER) ---
        function initSender() {
            peer = new Peer('proaudio-' + myId);
            
            peer.on('open', (id) => {
                document.getElementById('sender-code').innerText = myId;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                updateStatusUI(true);
                
                conn.on('close', () => {
                    updateStatusUI(false);
                });
            });
        }

        function updateStatusUI(isConnected) {
            const led = document.getElementById('hardware-led');
            const txt = document.getElementById('hardware-status-text');
            if (isConnected) {
                led.classList.add('led-active');
                txt.innerText = "ONLINE / LINKED";
                txt.className = "text-[10px] font-mono text-emerald-400";
            } else {
                led.classList.remove('led-active');
                txt.innerText = "OFFLINE";
                txt.className = "text-[10px] font-mono text-red-400";
            }
        }

        function sendCommand(action) {
            if (conn && conn.open) {
                conn.send({ type: 'command', action: action });
            } else {
                alert('Peringatan: HP 2 (Player) belum terhubung secara P2P!');
            }
        }

        function sendYouTube() {
            const url = document.getElementById('yt-url').value.trim();
            if (!url) return alert('Masukkan URL YouTube yang valid!');
            
            const videoId = extractYouTubeId(url);
            if (!videoId) return alert('Format URL YouTube tidak dikenali!');

            if (conn && conn.open) {
                conn.send({ type: 'youtube', videoId: videoId });
                alert('Stream YouTube berhasil dikirim ke HP 2!');
            } else {
                alert('Peringatan: HP 2 belum terhubung!');
            }
        }

        // Pengiriman File Lokal via Data Channel PeerJS
        document.getElementById('local-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (conn && conn.open) {
                alert('Mengirim data file media... Mohon tunggu sesaat.');
                const reader = new FileReader();
                reader.onload = function(evt) {
                    conn.send({ type: 'file', fileData: evt.target.result, fileName: file.name, fileType: file.type });
                    alert('File media berhasil dikirim ke HP 2!');
                };
                reader.readAsDataURL(file);
            } else {
                alert('Peringatan: HP 2 belum terhubung!');
            }
        });

        // --- INISIALISASI HP 2 (SLAVE PLAYER) ---
        function connectToSender() {
            const code = document.getElementById('input-code').value.trim();
            if (!code || code.length !== 4) return alert('Masukkan 4 digit kode dari HP 1!');

            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect('proaudio-' + code);

                conn.on('open', () => {
                    alert('Berhasil terhubung ke Master Kontroler!');
                });

                conn.on('data', (data) => {
                    handleIncomingData(data);
                });

                conn.on('error', (err) => {
                    alert('Gagal menyambung: Pastikan kode benar dan aktif.');
                });
            });
        }

        // --- PROSES DATA MASUK PADA PLAYER ---
        function handleIncomingData(data) {
            const placeholder = document.getElementById('player-placeholder');
            const ytContainer = document.getElementById('yt-player-container');
            const avPlayer = document.getElementById('audio-video-player');

            placeholder.classList.add('hidden');

            if (data.type === 'youtube') {
                avPlayer.classList.add('hidden');
                avPlayer.pause();
                ytContainer.classList.remove('hidden');
                
                if (!window.YT) {
                    let tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    document.head.appendChild(tag);
                    
                    window.onYouTubeIframeAPIReady = function() {
                        createYTPlayer(data.videoId);
                    }
                } else {
                    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                        ytPlayer.loadVideoById(data.videoId);
                    } else {
                        createYTPlayer(data.videoId);
                    }
                }
            } else if (data.type === 'file') {
                ytContainer.classList.add('hidden');
                avPlayer.classList.remove('hidden');
                avPlayer.src = data.fileData;
                avPlayer.play().catch(e => console.log("Auto-play blocked:", e));
            } else if (data.type === 'command') {
                if (data.action === 'play') {
                    if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
                    if (avPlayer) avPlayer.play();
                } else if (data.action === 'pause') {
                    if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
                    if (avPlayer) avPlayer.pause();
                }
            }
        }

        function createYTPlayer(videoId) {
            ytPlayer = new YT.Player('yt-player-container', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0 }
            });
        }

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Interaksi Potensio 3D & Fader Geser
        let knobAngle = -45;
        function rotateKnob() {
            knobAngle = (knobAngle + 45) % 180;
            document.getElementById('knob-ind').style.transform = `rotate(${knobAngle}deg)`;
        }

        // Fader Touch/Drag Interaktif
        document.querySelectorAll('.fader-track').forEach(track => {
            const handle = track.querySelector('.fader-handle');
            let isDragging = false;

            handle.addEventListener('mousedown', () => isDragging = true);
            window.addEventListener('mouseup', () => isDragging = false);
            
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                updateFaderPosition(track, handle, e.clientY);
            });

            handle.addEventListener('touchstart', () => isDragging = true);
            window.addEventListener('touchend', () => isDragging = false);
            
            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                updateFaderPosition(track, handle, e.touches[0].clientY);
            });
        });

        function updateFaderPosition(track, handle, clientY) {
            const rect = track.getBoundingClientRect();
            let y = clientY - rect.top;
            let minY = 10;
            let maxY = rect.height - 40;
            if (y >= minY && y <= maxY) {
                handle.style.top = y + 'px';
            }
        }

        // Web Bluetooth API Pairing Hardware Speaker Eksternal
        async function requestBluetooth() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['audio_sink']
                });
                alert('Berhasil terhubung dengan perangkat Audio Bluetooth: ' + device.name);
            } catch (error) {
                console.log('Bluetooth pairing dibatalkan atau error:', error);
                alert('Pastikan browser Chrome Android mendukung Web Bluetooth dan izin telah aktif.');
            }
        }
    </script>
</body>
</html>
