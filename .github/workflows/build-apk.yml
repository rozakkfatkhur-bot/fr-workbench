name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK Path
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_ENV

      - name: Install Cordova
        run: npm install -g cordova

      - name: Buat Struktur Cordova App
        run: |
          cordova create app com.fraudio.dlms FRAudioDLMS
          cd app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          if [ -f www/FR-EHLEY-T3-VIRTUAL-DLMS.html ]; then
            cp www/FR-EHLEY-T3-VIRTUAL-DLMS.html www/index.html
          elif [ -f www/index.html ]; then
            echo "index.html ditemukan"
          else
            FIRST_HTML=$(ls www/*.html | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            fi
          fi

          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK Sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR_Audio_DLMS_APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
