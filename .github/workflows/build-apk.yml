name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Buat Struktur Cordova App & Build
        run: |
          cordova create app com.fraudio.dlms FRAudioDLMS
          cd app
          rm -rf www/*
          
          # Salin file HTML FR-EHLEY-T3-VIRTUAL-DLMS.html sebagai index.html utama
          if [ -f "../FR-EHLEY-T3-VIRTUAL-DLMS.html" ]; then
            cp "../FR-EHLEY-T3-VIRTUAL-DLMS.html" www/index.html
          fi
          
          # Salin seluruh file pendukung
          cp -r ../* www/ 2>/dev/null || true

          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK Sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR_Audio_DLMS_APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
