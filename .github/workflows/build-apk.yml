name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Buat Struktur Cordova App
        run: |
          cordova create app com.fraudio.dlms FRAudioDLMS
          cd app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          if [ -f www/FR-EHLEY-T3-VIRTUAL-DLMS.html ]; then
            cp www/FR-EHLEY-T3-VIRTUAL-DLMS.html www/index.html
          fi

          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Upload APK Sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR_Audio_DLMS_APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
