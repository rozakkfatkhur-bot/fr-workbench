<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonnox Oxford EQ - Fully Interactive Web DSP (Pro Version)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f131a;
            color: #d0d8e0;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .plugin-rack {
            width: 880px;
            background: linear-gradient(135deg, #a4c2e8 0%, #7b9fc9 50%, #597c9f 100%);
            border: 5px solid #1a222d;
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,255,255,0.4);
            padding: 12px;
        }

        .header-bar {
            display: grid;
            grid-template-columns: 140px 1fr 140px;
            align-items: center;
            background: #4b6482;
            border: 2px solid #27374b;
            border-radius: 4px;
            padding: 4px 8px;
            margin-bottom: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .header-logo-left {
            background: linear-gradient(to bottom, #2b3e56, #1a2738);
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border: 1px solid #111;
            border-radius: 2px;
            letter-spacing: 1px;
        }
        .header-title-center {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .header-logo-right {
            background: linear-gradient(to bottom, #1a2738, #2b3e56);
            color: #a0c0e0;
            font-size: 10px;
            padding: 4px 6px;
            border: 1px solid #111;
            border-radius: 2px;
            text-align: right;
            line-height: 1.1;
        }

        .screen-container {
            background-color: #1a2332;
            border: 4px inset #2d3d54;
            border-radius: 4px;
            height: 200px;
            margin-bottom: 10px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rack-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .panel-box {
            background: rgba(85, 110, 140, 0.45);
            border: 2px solid #3c526d;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.2), 0 2px 5px rgba(0,0,0,0.3);
            position: relative;
        }

        .panel-box.beveled-left {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 35%, 15% 0);
            padding-top: 12px;
        }
        .panel-box.beveled-right {
            clip-path: polygon(0 0, 100% 0, 100% 35%, 100% 100%, 0 100%);
            padding-top: 12px;
        }

        .center-master-panel {
            background: rgba(65, 85, 110, 0.75);
            border: 2px solid #2d3d52;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .badge-type {
            background: linear-gradient(to bottom, #f5d76c, #d4af37);
            color: #111;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 2px;
            border: 1px solid #7c6212;
            text-align: center;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .badge-over {
            background: #11161d;
            color: #00ffcc;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 2px;
            border: 1px solid #000;
            text-align: center;
            width: 100%;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .label-text {
            font-size: 8px;
            font-weight: bold;
            color: #1a2433;
            margin-bottom: 1px;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .oct-box {
            background: #1e2836;
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            border: 1px solid #0a0e14;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-toggle {
            background-color: #589670;
            color: #111;
            border: 2px outset #7cbfa4;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 2px;
            cursor: pointer;
        }
        .btn-toggle.active {
            background-color: #2e5940;
            border-style: inset;
            color: #fff;
        }
        .btn-toggle.bypass-off {
            background-color: #883333;
            color: #ffcccc;
            border-color: #aa5555;
        }

        .btn-ab {
            padding: 2px 8px; 
            font-size: 8px; 
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid #000;
        }
        .btn-ab.active-a { background: #d9534f; color: #fff; border-style: inset; }
        .btn-ab.inactive-a { background: #a94442; color: #ddd; opacity: 0.6; }
        .btn-ab.active-b { background: #f0ad4e; color: #111; border-style: inset; }
        .btn-ab.inactive-b { background: #eea236; color: #555; opacity: 0.6; }

        .knob-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 4px;
        }
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0;
        }
        .knob {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #555 20%, #1a1a1a 85%);
            border: 2px solid #0a0e14;
            position: relative;
            cursor: ns-resize;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.3);
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 17px;
            width: 3px;
            height: 11px;
            background: #ffcc00;
            border-radius: 2px;
            transform-origin: bottom center;
        }
        .knob-value {
            font-size: 8px;
            margin-top: 2px;
            color: #111a26;
            font-weight: bold;
            font-family: monospace;
        }

        .knob.grey::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #9ca3af, #4b5563); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.grey::after { z-index: 2; }

        .knob.blue::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #3b82f6, #1d4ed8); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.blue::after { z-index: 2; }

        .knob.red::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #ef4444, #b91c1c); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.red::after { z-index: 2; }

        .knob.yellow::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #eab308, #a16207); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.yellow::after { z-index: 2; }

        .knob.cyan::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #06b6d4, #0e7490); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.cyan::after { z-index: 2; }

        .player-deck {
            background: #1c2636;
            border: 2px solid #0a0e14;
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.7);
        }
        .player-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .player-row input[type="file"] {
            color: #d0d8e0;
            font-size: 11px;
        }
        .player-row button {
            background: linear-gradient(to bottom, #506e94, #364d6b);
            color: white;
            border: 1px solid #222;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
        audio { width: 100%; height: 30px; outline: none; }
    </style>
</head>
<body>

<div class="plugin-rack">
    <div class="header-bar">
        <div class="header-logo-left">Sonnox</div>
        <div class="header-title-center">OXFORD EQ</div>
        <div class="header-logo-right">Oxford<br>Plugins :</div>

    <div class="screen-container">
        <canvas id="eqCanvas" width="850" height="200"></canvas>

    <div class="controls-grid">
        <div class="rack-row">
            <div class="panel-box beveled-left">

                <div class="badge-over">OVER</div>
                <span style="font-size:8px; color:#111; font-weight:bold;">TRIM</span>

                    <span class="knob-value" id="val-trim" style="font-size:7px;">0.0 dB</span>
                </div>
                <div style="display:flex; gap:4px; width:100%; justify-content:center;">

                    <button class="btn-ab inactive-b" id="btn-ab-b">B</button>

            <div class="panel-box beveled-right">

                    <button class="btn-toggle active" id="btn-hff-in">HF\</button>
                    <div class="oct-box" id="btn-hf-oct">6</div>
                </div>
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-hff-freq" data-min="5000" data-max="20000" data-val="10000" data-step="50"></div>
                        <span class="knob-value" id="val-hff-freq">10K Hz</span>

                    <div class="knob-container">

                        <span class="knob-value" id="val-hff-q">1.0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="rack-row">
            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-lmf-freq" data-min="100" data-max="1000" data-val="300" data-step="1"></div>
                        <span class="knob-value" id="val-lmf-freq">300 Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">GAIN</span>
                        <div class="knob grey" id="knob-lmf-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                        <span class="knob-value" id="val-lmf-gain">0.0 dB</span>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <span style="font-size:9px; font-weight:bold; color:#111;">LMF</span>
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-lmf-in">IN</button>

            </div>

            <div style="background: rgba(65, 85, 110, 0.3); border: 2px dashed #3c526d; border-radius:6px; display:flex; align-items:center; justify-content:center;">
                <span style="font-size:9px; color:#1c2636; font-weight:bold; letter-spacing:1px;">OXFORD DSP ENGINE</span>
            </div>

            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-hmf-freq" data-min="1000" data-max="10000" data-val="3000" data-step="10"></div>
                        <span class="knob-value" id="val-hmf-freq">3K Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">GAIN</span>
                        <div class="knob grey" id="knob-hmf-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                        <span class="knob-value" id="val-hmf-gain">0.0 dB</span>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-hmf-in">IN</button>
                    <span style="font-size:9px; font-weight:bold; color:#111;">HMF</span>

            </div>
        </div>

        <div class="rack-row">
            <div class="panel-box">
                <div class="knob-row">

                    <div class="knob-container">
                        <span class="label-text">Q</span>
                        <div class="knob blue" id="knob-p1-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>

                    <span class="knob-value" id="val-p1-gain">0.0 dB</span>

                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">

    <div class="player-deck">

            <input type="file" id="audioFile" accept="audio/*">
            <button id="playPauseBtn">PLAY / PAUSE AUDIO</button>
        </div>
        <audio id="audioElement" controls></audio>
    </div>
</div>

<script>
    let audioCtx = null;
    let sourceNode = null;
    let masterTrimNode = null;
    let analyserNode = null;
    let filters = {};
    let bypassState = { lff: true, hff: true, lmf: true, hmf: true, p1: true, p2: true, p3: true };
    let eqType = 1; 
    let currentBank = 'A';

    let stateA = {};
    let stateB = {};

    const canvas = document.getElementById('eqCanvas');
    const canvasCtx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    function initAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterTrimNode = audioCtx.createGain();
            masterTrimNode.gain.value = 1.0;

            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 256;

            const filterKeys = ['lff', 'hff', 'lmf', 'hmf', 'p1', 'p2', 'p3'];
            filterKeys.forEach(k => {
                filters[k] = audioCtx.createBiquadFilter();
            });

            filters['lff'].type = 'lowshelf';
            filters['hff'].type = 'highshelf';
            filters['lmf'].type = 'peaking';
            filters['hmf'].type = 'peaking';
            filters['p1'].type = 'peaking';
            filters['p2'].type = 'peaking';
            filters['p3'].type = 'peaking';

            let prevKey = null;
            filterKeys.forEach(k => {
                if (prevKey) filters[prevKey].connect(filters[k]);
                prevKey = k;
            });

            filters['p3'].connect(masterTrimNode);
            masterTrimNode.connect(analyserNode);
            analyserNode.connect(audioCtx.destination);

            startPeakMeter();
        }
    }

    function startPeakMeter() {
        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const overBadge = document.querySelector('.badge-over');
        let holdTimer = null;

        function checkPeak() {
            if (!audioCtx || audioCtx.state !== 'running') {
                requestAnimationFrame(checkPeak);
                return;
            }

            analyserNode.getByteTimeDomainData(dataArray);
            let maxSample = 0;
            
            for (let i = 0; i < bufferLength; i++) {
                let sample = Math.abs(dataArray[i] - 128) / 128;
                if (sample > maxSample) maxSample = sample;
            }

            if (maxSample >= 0.98) {
                overBadge.style.background = '#ff3333';
                overBadge.style.color = '#ffffff';
                overBadge.style.boxShadow = '0 0 8px #ff3333';
                
                clearTimeout(holdTimer);
                holdTimer = setTimeout(() => {
                    overBadge.style.background = '#11161d';
                    overBadge.style.color = '#00ffcc';
                    overBadge.style.boxShadow = 'none';
                }, 400);
            }

            requestAnimationFrame(checkPeak);
        }
        requestAnimationFrame(checkPeak);
    }

    const knobMap = {
        'knob-lff-freq': { filter: 'lff', param: 'frequency', unit: 'Hz' },
        'knob-lff-q':    { filter: 'lff', param: 'Q', unit: '' },
        'knob-hff-freq': { filter: 'hff', param: 'frequency', unit: 'Hz' },
        'knob-hff-q':    { filter: 'hff', param: 'Q', unit: '' },
        'knob-lmf-freq': { filter: 'lmf', param: 'frequency', unit: 'Hz' },
        'knob-lmf-gain': { filter: 'lmf', param: 'gain', unit: 'dB' },
        'knob-hmf-freq': { filter: 'hmf', param: 'frequency', unit: 'Hz' },
        'knob-hmf-gain': { filter: 'hmf', param: 'gain', unit: 'dB' },
        'knob-trim':     { type: 'trim', unit: 'dB' },

        'knob-p1-freq':  { filter: 'p1', param: 'frequency', unit: 'Hz' },
        'knob-p1-q':     { filter: 'p1', param: 'Q', unit: '' },
        'knob-p1-gain':  { filter: 'p1', param: 'gain', unit: 'dB' },

        'knob-p2-freq':  { filter: 'p2', param: 'frequency', unit: 'Hz' },
        'knob-p2-q':     { filter: 'p2', param: 'Q', unit: '' },
        'knob-p2-gain':  { filter: 'p2', param: 'gain', unit: 'dB' },

        'knob-p3-freq':  { filter: 'p3', param: 'frequency', unit: 'Hz' },
        'knob-p3-q':     { filter: 'p3', param: 'Q', unit: '' }, 
        'knob-p3-gain':  { filter: 'p3', param: 'gain', unit: 'dB' }
    };

    document.querySelectorAll('.knob').forEach(knob => {
        stateA[knob.id] = parseFloat(knob.getAttribute('data-val'));
        stateB[knob.id] = parseFloat(knob.getAttribute('data-val'));
    });

    document.querySelectorAll('.knob').forEach(knob => {
        let isDragging = false;
        let startY = 0;
        const id = knob.id;
        const cfg = knobMap[id];
        if (!cfg) return;

        let min = parseFloat(knob.getAttribute('data-min'));
        let max = parseFloat(knob.getAttribute('data-max'));
        let step = parseFloat(knob.getAttribute('data-step'));

        function updateKnobState(val, saveToCurrentBank = true) {
            let percent = (val - min) / (max - min);
            let deg = percent * 270 - 135;
            knob.style.transform = `rotate(${deg}deg)`;
            knob.setAttribute('data-val', val);

            if (saveToCurrentBank) {
                if (currentBank === 'A') stateA[id] = val;
                else stateB[id] = val;
            }

            let displayTxt = val;
            if (cfg.param === 'frequency' && val >= 1000) {
                displayTxt = (val / 1000).toFixed(val % 1000 !== 0 ? 1 : 0) + 'K';
            } else {
                displayTxt = val.toFixed(cfg.unit === 'dB' ? 1 : 1);
            }

            const valSpan = document.getElementById('val-' + id.replace('knob-', ''));
            if (valSpan) valSpan.textContent = displayTxt + ' ' + cfg.unit;

            if (audioCtx) {
                let currentTime = audioCtx.currentTime;
                let targetTime = currentTime + 0.03; // Smooth ramp to avoid zipper noise

                if (cfg.type === 'trim') {
                    let targetGain = Math.pow(10, val / 20);
                    masterTrimNode.gain.cancelScheduledValues(currentTime);
                    masterTrimNode.gain.setValueAtTime(masterTrimNode.gain.value, currentTime);
                    masterTrimNode.gain.linearRampToValueAtTime(targetGain, targetTime);
                } else if (cfg.filter && filters[cfg.filter]) {
                    let activeVal = bypassState[cfg.filter] ? val : (cfg.param === 'gain' ? 0 : filters[cfg.filter][cfg.param].value);
                    if (cfg.filter === 'p3' && cfg.param === 'Q' && eqType === 2) {
                        activeVal *= 1.5; 
                    }
                    let paramObj = filters[cfg.filter][cfg.param];
                    paramObj.cancelScheduledValues(currentTime);
                    paramObj.setValueAtTime(paramObj.value, currentTime);
                    paramObj.linearRampToValueAtTime(activeVal, targetTime);
                }
            }
            drawFrequencyCurve();
        }

        updateKnobState(parseFloat(knob.getAttribute('data-val')), false);

        knob.addEventListener('mousedown', (e) => {
            isDragging = true;
            startY = e.clientY;
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let deltaY = startY - e.clientY;
            startY = e.clientY;

            let val = parseFloat(knob.getAttribute('data-val'));
            let range = max - min;
            val += (deltaY / 100) * range * 0.08;
            if (val < min) val = min;
            if (val > max) val = max;

            val = Math.round(val / step) * step;
            updateKnobState(val, true);
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
    });

    const bypassMap = {
        'btn-lff-in': 'lff',
        'btn-hff-in': 'hff',
        'btn-lmf-in': 'lmf',
        'btn-hmf-in': 'hmf',
        'btn-p1-in': 'p1',
        'btn-p2-in': 'p2',
        'btn-p3-in': 'p3'
    };

    Object.keys(bypassMap).forEach(btnId => {
        const btn = document.getElementById(btnId);
        const filterKey = bypassMap[btnId];
        if (!btn) return;

        btn.addEventListener('click', () => {
            bypassState[filterKey] = !bypassState[filterKey];
            btn.classList.toggle('active', bypassState[filterKey]);
            btn.classList.toggle('bypass-off', !bypassState[filterKey]);

            if (audioCtx && filters[filterKey]) {
                if (!bypassState[filterKey]) {
                    if (filters[filterKey].type === 'peaking') filters[filterKey].gain.value = 0;
                    else filters[filterKey].Q.value = 0.1;
                } else {
                    const activeKnob = document.getElementById(filterKey === 'lff' || filterKey === 'hff' ? `knob-${filterKey}-q` : `knob-${filterKey}-gain`);
                    if (activeKnob) {
                        filters[filterKey][filterKey.includes('ff') ? 'Q' : 'gain'].value = parseFloat(activeKnob.getAttribute('data-val'));
                    }
                }
            }
            drawFrequencyCurve();
        });
    });

    const btnEqType = document.getElementById('btn-eq-type');
    btnEqType.addEventListener('click', () => {
        eqType = eqType === 1 ? 2 : 1;
        btnEqType.textContent = `TYPE ${eqType}`;
        drawFrequencyCurve();
    });

    const btnA = document.getElementById('btn-ab-a');
    const btnB = document.getElementById('btn-ab-b');

    function switchBank(targetBank) {
        currentBank = targetBank;
        const sourceState = currentBank === 'A' ? stateA : stateB;

        if (currentBank === 'A') {
            btnA.className = 'btn-ab active-a';
            btnB.className = 'btn-ab inactive-b';
        } else {
            btnB.className = 'btn-ab active-b';
            btnA.className = 'btn-ab inactive-a';
        }

        Object.keys(sourceState).forEach(knobId => {
            const knob = document.getElementById(knobId);
            if (!knob) return;
            let val = sourceState[knobId];
            let min = parseFloat(knob.getAttribute('data-min'));
            let max = parseFloat(knob.getAttribute('data-max'));
            let percent = (val - min) / (max - min);
            let deg = percent * 270 - 135;
            knob.style.transform = `rotate(${deg}deg)`;
            knob.setAttribute('data-val', val);

            const cfg = knobMap[knobId];
            const valSpan = document.getElementById('val-' + knobId.replace('knob-', ''));
            if (valSpan) {
                let displayTxt = (cfg.param === 'frequency' && val >= 1000) ? (val / 1000).toFixed(val % 1000 !== 0 ? 1 : 0) + 'K' : val.toFixed(1);
                valSpan.textContent = displayTxt + ' ' + cfg.unit;
            }

            if (audioCtx) {
                if (cfg.type === 'trim') masterTrimNode.gain.value = Math.pow(10, val / 20);
                else if (cfg.filter && filters[cfg.filter]) filters[cfg.filter][cfg.param].value = val;
            }
        });
        drawFrequencyCurve();
    }

    btnA.addEventListener('click', () => switchBank('A'));
    btnB.addEventListener('click', () => switchBank('B'));

    function drawFrequencyCurve() {
        canvasCtx.fillStyle = '#1a2332';
        canvasCtx.fillRect(0, 0, width, height);

        const padLeft = 35;
        const padRight = 35;
        const plotWidth = width - padLeft - padRight;
        const plotHeight = height - 30;

        canvasCtx.strokeStyle = '#27374b';
        canvasCtx.lineWidth = 1;

        const freqMarkers = [20, 40, 60, 100, 200, 400, 600, 1000, 2000, 4000, 6000, 10000, 20000];
        freqMarkers.forEach(f => {
            let x = padLeft + (Math.log10(f / 20) / Math.log10(20000 / 20)) * plotWidth;
            canvasCtx.beginPath(); canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x, plotHeight); canvasCtx.stroke();
            
            if ([20, 40, 60, 100, 200, 400, 600, 1000, 2000, 4000, 6000, 10000].includes(f)) {
                canvasCtx.fillStyle = '#8899aa';
                canvasCtx.font = '8px Arial';
                let labelTxt = f >= 1000 ? (f/1000) + 'K' : f;
                canvasCtx.fillText(labelTxt, x - 6, height - 6);
            }
        });

        const dbSteps = [20, 15, 10, 5, 0, -5, -10, -15, -20];
        dbSteps.forEach(db => {
            let y = (plotHeight / 2) - (db * (plotHeight / 40));
            canvasCtx.strokeStyle = db === 0 ? '#384d6b' : '#27374b';
            canvasCtx.beginPath(); canvasCtx.moveTo(padLeft, y); canvasCtx.lineTo(width - padRight, y); canvasCtx.stroke();

            canvasCtx.fillStyle = '#8899aa';
            canvasCtx.font = '8px Arial';
            let txt = (db > 0 ? '+' : '') + db;
            canvasCtx.fillText(txt, 5, y + 3);
            canvasCtx.fillText(txt, width - 28, y + 3);
        });

        const freqArray = new Float32Array(plotWidth);
        for (let i = 0; i < plotWidth; i++) {
            freqArray[i] = 20 * Math.pow(20000 / 20, i / plotWidth);
        }

        let totalMag = new Float32Array(plotWidth).fill(1.0);
        if (audioCtx) {
            Object.keys(filters).forEach(k => {
                if (!bypassState[k]) return;
                const mag = new Float32Array(plotWidth);
                const phase = new Float32Array(plotWidth);
                filters[k].getFrequencyResponse(freqArray, mag, phase);
                for (let i = 0; i < plotWidth; i++) totalMag[i] *= mag[i];
            });
        }

        canvasCtx.strokeStyle = '#e6d545';
        canvasCtx.lineWidth = 2.5;
        canvasCtx.beginPath();

        for (let i = 0; i < plotWidth; i++) {
            let db = 20 * Math.log10(Math.max(totalMag[i], 0.0001));
            let y = (plotHeight / 2) - (db * (plotHeight / 40));
            let x = padLeft + i;
            if (i === 0) canvasCtx.moveTo(x, y);
            else canvasCtx.lineTo(x, y);
        }
        canvasCtx.stroke();

        canvasCtx.lineTo(padLeft + plotWidth, plotHeight / 2);
        canvasCtx.lineTo(padLeft, plotHeight / 2);
        canvasCtx.fillStyle = 'rgba(46, 117, 79, 0.35)';
        canvasCtx.fill();

        const bandMarkers = [
            { id: 'knob-lff-freq', color: '#9ca3af' },
            { id: 'knob-p1-freq', color: '#3b82f6' },
            { id: 'knob-p2-freq', color: '#ef4444' },
            { id: 'knob-p3-freq', color: '#eab308' },
            { id: 'knob-hff-freq', color: '#ffffff' }
        ];

        bandMarkers.forEach(m => {
            const knob = document.getElementById(m.id);
            if (!knob) return;
            let fVal = parseFloat(knob.getAttribute('data-val'));
            let x = padLeft + (Math.log10(fVal / 20) / Math.log10(20000 / 20)) * plotWidth;
            
            let correspondingGainId = m.id.replace('freq', 'gain');
            let gVal = 0;
            const gKnob = document.getElementById(correspondingGainId);
            if (gKnob) gVal = parseFloat(gKnob.getAttribute('data-val'));

            let y = (plotHeight / 2) - (gVal * (plotHeight / 40));

            canvasCtx.fillStyle = m.color;
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 4, 0, Math.PI * 2);
            canvasCtx.fill();
            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = '#000';
            canvasCtx.stroke();
        });
    }

    setTimeout(drawFrequencyCurve, 100);

    const audioElement = document.getElementById('audioElement');
    const audioFileInput = document.getElementById('audioFile');
    const playPauseBtn = document.getElementById('playPauseBtn');

    audioFileInput.addEventListener('change', function(e) {
        initAudioEngine();
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        audioElement.src = fileURL;

        if (sourceNode) {
            try { sourceNode.disconnect(); } catch(err) {}
        }

        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(filters['lff']);
        audioElement.play();
    });

    playPauseBtn.addEventListener('click', () => {
        initAudioEngine();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (audioElement.paused) audioElement.play();
        else audioElement.pause();
    });
</script>
