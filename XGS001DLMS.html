<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonnox Oxford EQ - Fully Interactive Web DSP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f131a;
            color: #d0d8e0;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Container Utama Plugin (Sonnox Rack) */
        .plugin-rack {
            width: 880px;
            background: linear-gradient(135deg, #a4c2e8 0%, #7b9fc9 50%, #597c9f 100%);
            border: 5px solid #1a222d;
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,255,255,0.4);
            padding: 12px;
        }

        /* Header Atas */
        .header-bar {
            display: grid;
            grid-template-columns: 140px 1fr 140px;
            align-items: center;
            background: #4b6482;
            border: 2px solid #27374b;
            border-radius: 4px;
            padding: 4px 8px;
            margin-bottom: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .header-logo-left {
            background: linear-gradient(to bottom, #2b3e56, #1a2738);
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border: 1px solid #111;
            border-radius: 2px;
            letter-spacing: 1px;
        }
        .header-title-center {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .header-logo-right {
            background: linear-gradient(to bottom, #1a2738, #2b3e56);
            color: #a0c0e0;
            font-size: 10px;
            padding: 4px 6px;
            border: 1px solid #111;
            border-radius: 2px;
            text-align: right;
            line-height: 1.1;
        }

        /* Layar Grafik (Screen Area) */
        .screen-container {
            background-color: #1a2332;
            border: 4px inset #2d3d54;
            border-radius: 4px;
            height: 200px;
            margin-bottom: 10px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Layout Grid Kontrol */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rack-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        /* Modul Panel Individual */
        .panel-box {
            background: rgba(85, 110, 140, 0.45);
            border: 2px solid #3c526d;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.2), 0 2px 5px rgba(0,0,0,0.3);
            position: relative;
        }
        .center-master-panel {
            background: rgba(65, 85, 110, 0.75);
            border: 2px solid #2d3d52;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Badge & Label */
        .badge-type {
            background: linear-gradient(to bottom, #f5d76c, #d4af37);
            color: #111;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 2px;
            border: 1px solid #7c6212;
            text-align: center;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .badge-over {
            background: #11161d;
            color: #00ffcc;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 2px;
            border: 1px solid #000;
            text-align: center;
            width: 100%;
        }
        .label-text {
            font-size: 8px;
            font-weight: bold;
            color: #1a2433;
            margin-bottom: 1px;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .oct-box {
            background: #1e2836;
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            border: 1px solid #0a0e14;
            font-weight: bold;
            cursor: pointer;
        }

        /* Tombol Interaktif */
        .btn-toggle {
            background-color: #589670;
            color: #111;
            border: 2px outset #7cbfa4;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 2px;
            cursor: pointer;
        }
        .btn-toggle.active {
            background-color: #2e5940;
            border-style: inset;
            color: #fff;
        }

        /* Desain Knob Presisi Tinggi */
        .knob-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 4px;
        }
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0;
        }
        .knob {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #555 20%, #1a1a1a 85%);
            border: 2px solid #0a0e14;
            position: relative;
            cursor: ns-resize;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.3);
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 17px;
            width: 3px;
            height: 11px;
            background: #ffcc00;
            border-radius: 2px;
            transform-origin: bottom center;
        }
        .knob-value {
            font-size: 8px;
            margin-top: 2px;
            color: #111a26;
            font-weight: bold;
            font-family: monospace;
        }

        /* Warna Topi Knob */
        .knob.grey::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #9ca3af, #4b5563); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.grey::after { z-index: 2; }

        .knob.blue::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #3b82f6, #1d4ed8); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.blue::after { z-index: 2; }

        .knob.red::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #ef4444, #b91c1c); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.red::after { z-index: 2; }

        .knob.yellow::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #eab308, #a16207); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.yellow::after { z-index: 2; }

        .knob.cyan::before { content:''; position:absolute; top:6px; left:6px; right:6px; bottom:6px; background:radial-gradient(circle, #06b6d4, #0e7490); border-radius:50%; border:1px solid #0a0e14; z-index:1; }
        .knob.cyan::after { z-index: 2; }

        /* Media Player Deck */
        .player-deck {
            background: #1c2636;
            border: 2px solid #0a0e14;
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.7);
        }
        .player-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .player-row input[type="file"] {
            color: #d0d8e0;
            font-size: 11px;
        }
        .player-row button {
            background: linear-gradient(to bottom, #506e94, #364d6b);
            color: white;
            border: 1px solid #222;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
        audio { width: 100%; height: 30px; outline: none; }
    </style>
</head>
<body>

<div class="plugin-rack">
    <!-- Header -->
    <div class="header-bar">
        <div class="header-logo-left">Sonnox</div>
        <div class="header-title-center">OXFORD EQ</div>
        <div class="header-logo-right">Oxford<br>Plugins :</div>
    </div>

    <!-- Layar Grafik -->
    <div class="screen-container">
        <canvas id="eqCanvas" width="850" height="200"></canvas>
    </div>

    <!-- Kontrol Utama (Sesuai Gambar Referensi) -->
    <div class="controls-grid">
        <!-- BARIS 1: LF Filter, Master Section, HF Filter -->
        <div class="rack-row">
            <!-- LF Filter (Atas Kiri) -->
            <div class="panel-box">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:4px; align-items:center;">
                    <div class="oct-box" id="btn-lf-oct">6</div>
                    <button class="btn-toggle active" id="btn-lf-type">/LF</button>
                </div>
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-lff-freq" data-min="20" data-max="250" data-val="60" data-step="1"></div>
                        <span class="knob-value" id="val-lff-freq">60 Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">Q</span>
                        <div class="knob grey" id="knob-lff-q" data-min="0.1" data-max="10" data-val="1.0" data-step="0.1"></div>
                        <span class="knob-value" id="val-lff-q">1.0</span>
                    </div>
                </div>
            </div>

            <!-- Master Center Panel -->
            <div class="center-master-panel">
                <div class="badge-type" id="btn-eq-type">TYPE 1</div>
                <div class="badge-over">OVER</div>
                <span style="font-size:8px; color:#111; font-weight:bold;">TRIM</span>
                <div class="knob-container" style="margin:2px 0;">
                    <div class="knob cyan" style="width:34px; height:34px;" id="knob-trim" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                    <span class="knob-value" id="val-trim" style="font-size:7px;">0.0 dB</span>
                </div>
                <div style="display:flex; gap:4px; width:100%; justify-content:center;">
                    <button class="btn-toggle active" style="padding:2px 6px; font-size:7px;" id="btn-ab-a">A</button>
                    <button class="btn-toggle" style="padding:2px 6px; font-size:7px; background:#888;" id="btn-ab-b">B</button>
                </div>
            </div>

            <!-- HF Filter (Atas Kanan) -->
            <div class="panel-box">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:4px; align-items:center;">
                    <button class="btn-toggle active" id="btn-hf-type">HF\</button>
                    <div class="oct-box" id="btn-hf-oct">6</div>
                </div>
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-hff-freq" data-min="5000" data-max="20000" data-val="10000" data-step="50"></div>
                        <span class="knob-value" id="val-hff-freq">10K Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">Q</span>
                        <div class="knob grey" id="knob-hff-q" data-min="0.1" data-max="10" data-val="1.0" data-step="0.1"></div>
                        <span class="knob-value" id="val-hff-q">1.0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- BARIS 2: LMF dan HMF Parametric -->
        <div class="rack-row">
            <!-- LMF Module -->
            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-lmf-freq" data-min="100" data-max="1000" data-val="300" data-step="1"></div>
                        <span class="knob-value" id="val-lmf-freq">300 Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">GAIN</span>
                        <div class="knob grey" id="knob-lmf-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                        <span class="knob-value" id="val-lmf-gain">0.0 dB</span>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <span style="font-size:9px; font-weight:bold; color:#111;">LMF</span>
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-lmf-in">IN</button>
                </div>
            </div>

            <!-- Panel Kosong / Spacer Tengah untuk tata letak persis gambar -->
            <div style="background: rgba(65, 85, 110, 0.3); border: 2px dashed #3c526d; border-radius:6px; display:flex; align-items:center; justify-content:center;">
                <span style="font-size:9px; color:#1c2636; font-weight:bold; letter-spacing:1px;">OXFORD DSP ENGINE</span>
            </div>

            <!-- HMF Module -->
            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob grey" id="knob-hmf-freq" data-min="1000" data-max="10000" data-val="3000" data-step="10"></div>
                        <span class="knob-value" id="val-hmf-freq">3K Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">GAIN</span>
                        <div class="knob grey" id="knob-hmf-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                        <span class="knob-value" id="val-hmf-gain">0.0 dB</span>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-hmf-in">IN</button>
                    <span style="font-size:9px; font-weight:bold; color:#111;">HMF</span>
                </div>
            </div>
        </div>

        <!-- BARIS 3: LF (Blue), MF (Red), HF (Yellow) Band Utama -->
        <div class="rack-row">
            <!-- LF Parametric (Biru) -->
            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob blue" id="knob-p1-freq" data-min="40" data-max="400" data-val="100" data-step="1"></div>
                        <span class="knob-value" id="val-p1-freq">100 Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">Q</span>
                        <div class="knob blue" id="knob-p1-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>
                        <span class="knob-value" id="val-p1-q">1.4</span>
                    </div>
                </div>
                <div class="knob-container" style="margin-top:4px;">
                    <span class="label-text">GAIN</span>
                    <div class="knob blue" id="knob-p1-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                    <span class="knob-value" id="val-p1-gain">0.0 dB</span>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <span style="font-size:9px; font-weight:bold; color:#111;">LF</span>
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-p1-in">IN</button>
                </div>
            </div>

            <!-- MF Parametric (Merah) -->
            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob red" id="knob-p2-freq" data-min="200" data-max="5000" data-val="1000" data-step="10"></div>
                        <span class="knob-value" id="val-p2-freq">1K Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">Q</span>
                        <div class="knob red" id="knob-p2-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>
                        <span class="knob-value" id="val-p2-q">1.4</span>
                    </div>
                </div>
                <div class="knob-container" style="margin-top:4px;">
                    <span class="label-text">GAIN</span>
                    <div class="knob red" id="knob-p2-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                    <span class="knob-value" id="val-p2-gain">0.0 dB</span>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <span style="font-size:9px; font-weight:bold; color:#111;">MF</span>
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-p2-in">IN</button>
                </div>
            </div>

            <!-- HF Parametric (Kuning) -->
            <div class="panel-box">
                <div class="knob-row">
                    <div class="knob-container">
                        <span class="label-text">FREQ</span>
                        <div class="knob yellow" id="knob-p3-freq" data-min="1000" data-max="16000" data-val="6000" data-step="10"></div>
                        <span class="knob-value" id="val-p3-freq">6K Hz</span>
                    </div>
                    <div class="knob-container">
                        <span class="label-text">OVERSHOOT</span>
                        <div class="knob yellow" id="knob-p3-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>
                        <span class="knob-value" id="val-p3-q">1.4</span>
                    </div>
                </div>
                <div class="knob-container" style="margin-top:4px;">
                    <span class="label-text">GAIN</span>
                    <div class="knob yellow" id="knob-p3-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                    <span class="knob-value" id="val-p3-gain">0.0 dB</span>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                    <button class="btn-toggle active" style="font-size:8px; padding:2px 6px;" id="btn-p3-in">IN</button>
                    <span style="font-size:9px; font-weight:bold; color:#111;">HF</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Pemutar Audio Lokal & DSP Loader -->
    <div class="player-deck">
        <div class="player-row">
            <input type="file" id="audioFile" accept="audio/*">
            <button id="playPauseBtn">PLAY / PAUSE AUDIO</button>
        </div>
        <audio id="audioElement" controls></audio>
    </div>
</div>

<script>
    // Web Audio API & DSP Engine Inisialisasi
    let audioCtx = null;
    let sourceNode = null;
    let masterTrimNode = null;
    let filters = {};

    const canvas = document.getElementById('eqCanvas');
    const canvasCtx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    function initAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterTrimNode = audioCtx.createGain();
            masterTrimNode.gain.value = 1.0;

            // Membuat filter biquad sesuai seluruh modul EQ
            const filterKeys = ['lff', 'hff', 'lmf', 'hmf', 'p1', 'p2', 'p3'];
            filterKeys.forEach(k => {
                filters[k] = audioCtx.createBiquadFilter();
            });

            filters['lff'].type = 'lowshelf';
            filters['hff'].type = 'highshelf';
            filters['lmf'].type = 'peaking';
            filters['hmf'].type = 'peaking';
            filters['p1'].type = 'peaking';
            filters['p2'].type = 'peaking';
            filters['p3'].type = 'peaking';

            // Rantai Hubungan Seri DSP
            let prevKey = null;
            filterKeys.forEach(k => {
                if (prevKey) filters[prevKey].connect(filters[k]);
                prevKey = k;
            });

            filters['p3'].connect(masterTrimNode);
            masterTrimNode.connect(audioCtx.destination);
        }
    }

    // Pemetaan Knob ke Parameter Audio
    const knobMap = {
        'knob-lff-freq': { filter: 'lff', param: 'frequency', unit: 'Hz' },
        'knob-lff-q':    { filter: 'lff', param: 'Q', unit: '' },
        'knob-hff-freq': { filter: 'hff', param: 'frequency', unit: 'Hz' },
        'knob-hff-q':    { filter: 'hff', param: 'Q', unit: '' },
        'knob-lmf-freq': { filter: 'lmf', param: 'frequency', unit: 'Hz' },
        'knob-lmf-gain': { filter: 'lmf', param: 'gain', unit: 'dB' },
        'knob-hmf-freq': { filter: 'hmf', param: 'frequency', unit: 'Hz' },
        'knob-hmf-gain': { filter: 'hmf', param: 'gain', unit: 'dB' },
        'knob-trim':     { type: 'trim', unit: 'dB' },

        'knob-p1-freq':  { filter: 'p1', param: 'frequency', unit: 'Hz' },
        'knob-p1-q':     { filter: 'p1', param: 'Q', unit: '' },
        'knob-p1-gain':  { filter: 'p1', param: 'gain', unit: 'dB' },

        'knob-p2-freq':  { filter: 'p2', param: 'frequency', unit: 'Hz' },
        'knob-p2-q':     { filter: 'p2', param: 'Q', unit: '' },
        'knob-p2-gain':  { filter: 'p2', param: 'gain', unit: 'dB' },

        'knob-p3-freq':  { filter: 'p3', param: 'frequency', unit: 'Hz' },
        'knob-p3-q':     { filter: 'p3', param: 'Q', unit: '' },
        'knob-p3-gain':  { filter: 'p3', param: 'gain', unit: 'dB' }
    };

    // Logika Interaksi Putar Knob (Drag Vertikal)
    document.querySelectorAll('.knob').forEach(knob => {
        let isDragging = false;
        let startY = 0;
        const id = knob.id;
        const cfg = knobMap[id];
        if (!cfg) return;

        let min = parseFloat(knob.getAttribute('data-min'));
        let max = parseFloat(knob.getAttribute('data-max'));
        let val = parseFloat(knob.getAttribute('data-val'));
        let step = parseFloat(knob.getAttribute('data-step'));

        function updateKnobState() {
            let percent = (val - min) / (max - min);
            let deg = percent * 270 - 135;
            knob.style.transform = `rotate(${deg}deg)`;

            let displayTxt = val;
            if (cfg.param === 'frequency' && val >= 1000) {
                displayTxt = (val / 1000).toFixed(val % 1000 !== 0 ? 1 : 0) + 'K';
            } else {
                displayTxt = val.toFixed(cfg.unit === 'dB' ? 1 : 1);
            }

            const valSpan = document.getElementById('val-' + id.replace('knob-', ''));
            if (valSpan) valSpan.textContent = displayTxt + ' ' + cfg.unit;

            if (audioCtx) {
                if (cfg.type === 'trim') {
                    masterTrimNode.gain.value = Math.pow(10, val / 20);
                } else if (cfg.filter && filters[cfg.filter]) {
                    filters[cfg.filter][cfg.param].value = val;
                }
            }
            drawFrequencyCurve();
        }

        updateKnobState();

        knob.addEventListener('mousedown', (e) => {
            isDragging = true;
            startY = e.clientY;
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let deltaY = startY - e.clientY;
            startY = e.clientY;

            let range = max - min;
            val += (deltaY / 100) * range * 0.08;
            if (val < min) val = min;
            if (val > max) val = max;

            val = Math.round(val / step) * step;
            knob.setAttribute('data-val', val);
            updateKnobState();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
    });

    // Interaksi Tombol Toggle (IN / Filter Type / AB)
    document.querySelectorAll('.btn-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            btn.classList.toggle('active');
        });
    });

    // Menggambar Grafik Respon Frekuensi presisi Oxford EQ
    function drawFrequencyCurve() {
        canvasCtx.fillStyle = '#1a2332';
        canvasCtx.fillRect(0, 0, width, height);

        // Grid Desibel & Frekuensi
        canvasCtx.strokeStyle = '#27374b';
        canvasCtx.lineWidth = 1;

        const freqMarkers = [20, 40, 60, 100, 200, 400, 600, 1000, 2000, 4000, 6000, 10000];
        freqMarkers.forEach(f => {
            let x = (Math.log10(f / 20) / Math.log10(1000 / 20)) * width;
            canvasCtx.beginPath(); canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x, height); canvasCtx.stroke();
        });

        for (let y = 0; y < height; y += 25) {
            canvasCtx.beginPath(); canvasCtx.moveTo(0, y); canvasCtx.lineTo(width, y); canvasCtx.stroke();
        }

        // Garis Tengah 0dB
        canvasCtx.strokeStyle = '#384d6b';
        canvasCtx.beginPath(); canvasCtx.moveTo(0, height / 2); canvasCtx.lineTo(width, height / 2); canvasCtx.stroke();

        // Watermark Teks Oxford EQ
        canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        canvasCtx.font = 'bold 64px Arial';
        canvasCtx.fillText("OXFORD EQ", 180, 120);

        // Kalkulasi Respon Filter
        const freqArray = new Float32Array(width);
        for (let i = 0; i < width; i++) {
            freqArray[i] = 20 * Math.pow(1000, i / width);
        }

        let totalMag = new Float32Array(width).fill(1.0);
        if (audioCtx) {
            Object.keys(filters).forEach(k => {
                const mag = new Float32Array(width);
                const phase = new Float32Array(width);
                filters[k].getFrequencyResponse(freqArray, mag, phase);
                for (let i = 0; i < width; i++) totalMag[i] *= mag[i];
            });
        }

        // Gambar Kurva Respon Kuning Emas
        canvasCtx.strokeStyle = '#e6d545';
        canvasCtx.lineWidth = 2.5;
        canvasCtx.beginPath();

        for (let i = 0; i < width; i++) {
            let db = 20 * Math.log10(Math.max(totalMag[i], 0.0001));
            let y = (height / 2) - (db * (height / 35));
            if (i === 0) canvasCtx.moveTo(i, y);
            else canvasCtx.lineTo(i, y);
        }
        canvasCtx.stroke();

        // Arsiran Hijau Transparan
        canvasCtx.lineTo(width, height);
        canvasCtx.lineTo(0, height);
        canvasCtx.fillStyle = 'rgba(46, 117, 79, 0.35)';
        canvasCtx.fill();
    }

    setTimeout(drawFrequencyCurve, 100);

    // Audio Player & File Uploader Handler
    const audioElement = document.getElementById('audioElement');
    const audioFileInput = document.getElementById('audioFile');
    const playPauseBtn = document.getElementById('playPauseBtn');

    audioFileInput.addEventListener('change', function(e) {
        initAudioEngine();
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        audioElement.src = fileURL;

        if (sourceNode) {
            try { sourceNode.disconnect(); } catch(err) {}
        }

        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(filters['lff']);
        audioElement.play();
    });

    playPauseBtn.addEventListener('click', () => {
        initAudioEngine();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (audioElement.paused) audioElement.play();
        else audioElement.pause();
    });
</script>
</body>
</html>
