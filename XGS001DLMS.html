<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGS001DLMS by FR AUDIO</title>
    <style>
        :root {
            --bg-dark: #120A1F;
            --bg-panel: #2A1A4A;
            --bg-graph: #1E1233;
            --primary-violet: #8A2BE2;
            --accent-violet: #DDA0DD;
            --text-white: #FFFFFF;
            --text-muted: #B0A3D1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dlms-container {
            background-color: var(--bg-panel);
            width: 1000px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary-violet);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-violet);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--accent-violet);
        }

        .media-loader {
            padding: 15px;
            display: flex;
            gap: 10px;
            background-color: rgba(0,0,0,0.2);
            align-items: center;
            justify-content: space-between;
        }

        .media-loader input, .media-loader button {
            background-color: var(--bg-dark);
            color: var(--text-white);
            border: 1px solid var(--primary-violet);
            padding: 8px;
            border-radius: 4px;
        }

        .graph-section {
            padding: 20px;
            background-color: var(--bg-graph);
            border-bottom: 2px solid #000;
        }

        canvas {
            background-color: #0A0514;
            width: 100%;
            height: 250px;
            border: 1px solid var(--primary-violet);
            border-radius: 4px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            background-color: #000;
        }

        .band-panel {
            background-color: var(--bg-panel);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .band-panel:last-child {
            border-right: none;
        }

        .band-title {
            font-weight: bold;
            color: var(--accent-violet);
            margin-bottom: 15px;
        }

        .knob-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .knob-group label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 80%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--text-white);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px var(--primary-violet);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--primary-violet);
            border-radius: 2px;
        }

        .val-display {
            font-size: 11px;
            margin-top: 5px;
            font-family: monospace;
            background: #000;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid var(--primary-violet);
        }

        audio, video {
            width: 100%;
            margin-top: 10px;
            outline: none;
        }
        
        .av-container {
            padding: 0 15px 15px 15px;
            background-color: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="dlms-container">
    <div class="header">
        XGS001DLMS by FR AUDIO — The Violet and White Essence of Sound
    </div>
    
    <div class="media-loader">
        <div>
            <label style="font-size: 12px; margin-right: 10px;">Load File (Musik/Video):</label>
            <input type="file" id="file-input" accept="audio/*, video/*">
        </div>
        <div>
            <input type="text" id="yt-link" placeholder="Paste YouTube Link...">
            <button id="yt-btn">Load YT (Butuh Backend)</button>
        </div>
    </div>

    <div class="av-container">
        <!-- Media player akan muncul di sini -->
        <video id="media-player" controls height="150" style="display:none;"></video>
        <audio id="audio-player" controls style="display:none;"></audio>
    </div>

    <div class="graph-section">
        <canvas id="eq-graph" width="960" height="250"></canvas>
    </div>

    <div class="controls-grid" id="eq-controls">
        <!-- Panel LF -->
        <div class="band-panel" data-band="lf">
            <div class="band-title">LF (Low)</div>
            <div class="knob-group">
                <label>Freq</label>
                <input type="range" class="freq-slider" min="20" max="250" step="1" value="60">
                <div class="val-display freq-val">60 Hz</div>
            </div>
            <div class="knob-group">
                <label>Q</label>
                <input type="range" class="q-slider" min="0.1" max="10" step="0.1" value="1.0">
                <div class="val-display q-val">1.0</div>
            </div>
            <div class="knob-group">
                <label>Gain</label>
                <input type="range" class="gain-slider" min="-20" max="20" step="0.5" value="0">
                <div class="val-display gain-val">0 dB</div>
            </div>
        </div>

        <!-- Panel LMF -->
        <div class="band-panel" data-band="lmf">
            <div class="band-title">LMF (Low Mid)</div>
            <div class="knob-group">
                <label>Freq</label>
                <input type="range" class="freq-slider" min="100" max="1000" step="1" value="250">
                <div class="val-display freq-val">250 Hz</div>
            </div>
            <div class="knob-group">
                <label>Q</label>
                <input type="range" class="q-slider" min="0.1" max="10" step="0.1" value="1.4">
                <div class="val-display q-val">1.4</div>
            </div>
            <div class="knob-group">
                <label>Gain</label>
                <input type="range" class="gain-slider" min="-20" max="20" step="0.5" value="0">
                <div class="val-display gain-val">0 dB</div>
            </div>
        </div>

        <!-- Panel MF -->
        <div class="band-panel" data-band="mf">
            <div class="band-title">MF (Mid)</div>
            <div class="knob-group">
                <label>Freq</label>
                <input type="range" class="freq-slider" min="500" max="5000" step="10" value="1000">
                <div class="val-display freq-val">1000 Hz</div>
            </div>
            <div class="knob-group">
                <label>Q</label>
                <input type="range" class="q-slider" min="0.1" max="10" step="0.1" value="1.4">
                <div class="val-display q-val">1.4</div>
            </div>
            <div class="knob-group">
                <label>Gain</label>
                <input type="range" class="gain-slider" min="-20" max="20" step="0.5" value="0">
                <div class="val-display gain-val">0 dB</div>
            </div>
        </div>

        <!-- Panel HMF -->
        <div class="band-panel" data-band="hmf">
            <div class="band-title">HMF (High Mid)</div>
            <div class="knob-group">
                <label>Freq</label>
                <input type="range" class="freq-slider" min="2000" max="10000" step="10" value="4000">
                <div class="val-display freq-val">4000 Hz</div>
            </div>
            <div class="knob-group">
                <label>Q</label>
                <input type="range" class="q-slider" min="0.1" max="10" step="0.1" value="1.4">
                <div class="val-display q-val">1.4</div>
            </div>
            <div class="knob-group">
                <label>Gain</label>
                <input type="range" class="gain-slider" min="-20" max="20" step="0.5" value="0">
                <div class="val-display gain-val">0 dB</div>
            </div>
        </div>

        <!-- Panel HF -->
        <div class="band-panel" data-band="hf">
            <div class="band-title">HF (High)</div>
            <div class="knob-group">
                <label>Freq</label>
                <input type="range" class="freq-slider" min="5000" max="20000" step="50" value="10000">
                <div class="val-display freq-val">10000 Hz</div>
            </div>
            <div class="knob-group">
                <label>Q</label>
                <input type="range" class="q-slider" min="0.1" max="10" step="0.1" value="1.0">
                <div class="val-display q-val">1.0</div>
            </div>
            <div class="knob-group">
                <label>Gain</label>
                <input type="range" class="gain-slider" min="-20" max="20" step="0.5" value="0">
                <div class="val-display gain-val">0 dB</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Inisialisasi Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx, mediaSource;
    
    // Pembuatan Filter Nodes (Biquad Filter)
    const filters = {};
    const bands = ['lf', 'lmf', 'mf', 'hmf', 'hf'];
    const filterTypes = {
        'lf': 'lowshelf',
        'lmf': 'peaking',
        'mf': 'peaking',
        'hmf': 'peaking',
        'hf': 'highshelf'
    };

    const canvas = document.getElementById('eq-graph');
    const canvasCtx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    function initAudio() {
        if(audioCtx) return;
        audioCtx = new AudioContext();
        
        // Buat 5 Node Filter
        bands.forEach(band => {
            filters[band] = audioCtx.createBiquadFilter();
            filters[band].type = filterTypes[band];
        });

        // Hubungkan filter secara seri: LF -> LMF -> MF -> HMF -> HF -> Destination
        filters['lf'].connect(filters['lmf']);
        filters['lmf'].connect(filters['mf']);
        filters['mf'].connect(filters['hmf']);
        filters['hmf'].connect(filters['hf']);
        filters['hf'].connect(audioCtx.destination);
    }

    // Fungsi menggambar respons grafik EQ real-time
    function drawCurve() {
        if(!audioCtx) return;
        
        canvasCtx.clearRect(0, 0, width, height);
        
        // Gambar Grid
        canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        canvasCtx.lineWidth = 1;
        canvasCtx.beginPath();
        for(let i=10; i<width; i+=50) { canvasCtx.moveTo(i, 0); canvasCtx.lineTo(i, height); }
        for(let i=10; i<height; i+=30) { canvasCtx.moveTo(0, i); canvasCtx.lineTo(width, i); }
        canvasCtx.stroke();
        
        // Garis Netral (0 dB)
        canvasCtx.strokeStyle = '#DDA0DD';
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, height / 2);
        canvasCtx.lineTo(width, height / 2);
        canvasCtx.stroke();

        // Hitung Respons Frekuensi Gabungan
        const noOfFrequencies = width;
        const frequencyArray = new Float32Array(noOfFrequencies);
        for (let i = 0; i < noOfFrequencies; i++) {
            // Skala logaritmik dari 20Hz ke 20kHz
            frequencyArray[i] = 20 * Math.pow(1000, i / noOfFrequencies);
        }

        const totalMagResponse = new Float32Array(noOfFrequencies).fill(1.0);
        
        bands.forEach(band => {
            const magResponse = new Float32Array(noOfFrequencies);
            const phaseResponse = new Float32Array(noOfFrequencies);
            filters[band].getFrequencyResponse(frequencyArray, magResponse, phaseResponse);
            for (let i = 0; i < noOfFrequencies; i++) {
                totalMagResponse[i] *= magResponse[i];
            }
        });

        // Gambar Kurva EQ
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.lineWidth = 3;
        canvasCtx.beginPath();
        
        for (let i = 0; i < noOfFrequencies; i++) {
            // Konversi dari magnitude linear ke decibel (dB)
            const dbResponse = 20 * Math.log10(totalMagResponse[i]);
            // Petakan dB ke sumbu Y (Asumsi range +20dB ke -20dB)
            let y = height / 2 - (dbResponse * (height / 40)); 
            if (i === 0) canvasCtx.moveTo(i, y);
            else canvasCtx.lineTo(i, y);
        }
        
        // Warnai bagian bawah kurva
        canvasCtx.lineTo(width, height);
        canvasCtx.lineTo(0, height);
        canvasCtx.fillStyle = 'rgba(138, 43, 226, 0.3)'; // Warna ungu transparan
        canvasCtx.fill();
        canvasCtx.stroke();
    }

    // Setup Event Listeners untuk Slider
    document.querySelectorAll('.band-panel').forEach(panel => {
        const band = panel.getAttribute('data-band');
        const freqSlider = panel.querySelector('.freq-slider');
        const qSlider = panel.querySelector('.q-slider');
        const gainSlider = panel.querySelector('.gain-slider');
        
        const freqVal = panel.querySelector('.freq-val');
        const qVal = panel.querySelector('.q-val');
        const gainVal = panel.querySelector('.gain-val');

        function updateFilter() {
            initAudio(); // Pastikan AudioContext berjalan
            const freq = parseFloat(freqSlider.value);
            const q = parseFloat(qSlider.value);
            const gain = parseFloat(gainSlider.value);

            filters[band].frequency.value = freq;
            filters[band].Q.value = q;
            if(filters[band].gain) filters[band].gain.value = gain;

            freqVal.textContent = freq + ' Hz';
            qVal.textContent = q;
            gainVal.textContent = gain + ' dB';
            
            drawCurve();
        }

        freqSlider.addEventListener('input', updateFilter);
        qSlider.addEventListener('input', updateFilter);
        gainSlider.addEventListener('input', updateFilter);
        
        // Inisialisasi tampilan awal
        setTimeout(updateFilter, 100);
    });

    // Menangani File Musik / Video
    const fileInput = document.getElementById('file-input');
    const audioPlayer = document.getElementById('audio-player');
    const videoPlayer = document.getElementById('media-player');

    fileInput.addEventListener('change', function(e) {
        initAudio();
        const file = e.target.files[0];
        if(!file) return;

        const url = URL.createObjectURL(file);
        
        // Putus koneksi lama jika ada
        if(mediaSource) mediaSource.disconnect();
        
        let player;
        if(file.type.startsWith('video/')) {
            videoPlayer.style.display = 'block';
            audioPlayer.style.display = 'none';
            player = videoPlayer;
        } else {
            audioPlayer.style.display = 'block';
            videoPlayer.style.display = 'none';
            player = audioPlayer;
        }

        player.src = url;
        player.play();

        // Menyambungkan pemutar media ke filter LF (awal rantai)
        mediaSource = audioCtx.createMediaElementSource(player);
        mediaSource.connect(filters['lf']);
    });

    // Dummy Button YouTube
    document.getElementById('yt-btn').addEventListener('click', () => {
        alert("Kebijakan browser saat ini mencegah pemrosesan suara dari link eksternal (YouTube) secara langsung menggunakan Web Audio API (CORS issue). Anda perlu mengimplementasikan backend Node.js (misal: dengan ytdl-core) untuk menjadikan fitur ini bekerja di produksi nyata.");
    });

</script>
</body>
</html>
