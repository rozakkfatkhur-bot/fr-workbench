<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGS001DLMS by FR AUDIO — The Violet and White Essence of Sound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b0d12;
            color: #d0d8e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
        }

        /* Rack Utama Plugin */
        .plugin-container {
            width: 840px;
            background: linear-gradient(135deg, #7c92b2, #5a7396);
            border: 4px solid #2a384d;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            padding: 10px;
        }

        /* Header Atas */
        .sonnox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #415470;
            padding: 4px 10px;
            border: 1px solid #222e3f;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        .sonnox-header .brand-right {
            font-size: 9px;
            color: #cfd8e8;
            border: 1px solid #222;
            padding: 1px 4px;
            background: #2b3a4f;
        }

        /* Layar Grafik (Screen Area) */
        .screen-container {
            background-color: #171f2e;
            border: 3px inset #2d3d54;
            border-radius: 3px;
            height: 200px;
            margin-bottom: 8px;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tata Letak Kontrol */
        .section-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .panel-module {
            background: rgba(90, 112, 143, 0.45);
            border: 1px solid #455a78;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .top-shelf-row {
            display: grid;
            grid-template-columns: 1fr 130px 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .center-master-box {
            background: rgba(65, 84, 112, 0.7);
            border: 1px solid #324259;
            border-radius: 4px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Label & Badge */
        .badge-type {
            background: #d4af37;
            color: #111;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 2px;
            border: 1px solid #9c7f23;
            text-align: center;
            width: 100%;
        }
        .badge-over {
            background: #111;
            color: #00ffcc;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 2px;
            text-align: center;
            width: 100%;
        }
        .label-text {
            font-size: 9px;
            font-weight: bold;
            color: #1a222e;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .oct-box {
            background: #232f42;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            border: 1px solid #111;
            text-align: center;
            font-weight: bold;
        }

        /* Desain Knob Presisi ala Oxford EQ */
        .knob-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 4px;
        }
        .knob-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0;
        }
        .knob {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, #666 30%, #222 85%);
            border: 2px solid #111;
            position: relative;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.5);
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 18px;
            width: 3px;
            height: 11px;
            background: #ffcc00;
            border-radius: 2px;
            transform-origin: bottom center;
        }
        .knob-val {
            font-size: 8px;
            margin-top: 2px;
            color: #111;
            font-weight: bold;
            font-family: monospace;
        }

        /* Warna Topi Knob Spesifik */
        .knob.blue::before { content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:radial-gradient(circle, #3b82f6, #1d4ed8); border-radius:50%; border:1px solid #111; z-index:1; }
        .knob.blue::after { z-index: 2; }

        .knob.green::before { content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:radial-gradient(circle, #10b981, #047857); border-radius:50%; border:1px solid #111; z-index:1; }
        .knob.green::after { z-index: 2; }

        .knob.red::before { content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:radial-gradient(circle, #ef4444, #b91c1c); border-radius:50%; border:1px solid #111; z-index:1; }
        .knob.red::after { z-index: 2; }

        .knob.yellow::before { content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:radial-gradient(circle, #eab308, #a16207); border-radius:50%; border:1px solid #111; z-index:1; }
        .knob.yellow::after { z-index: 2; }

        .knob.cyan::before { content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:radial-gradient(circle, #06b6d4, #0e7490); border-radius:50%; border:1px solid #111; z-index:1; }
        .knob.cyan::after { z-index: 2; }

        .knob.grey::before { content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; background:radial-gradient(circle, #9ca3af, #4b5563); border-radius:50%; border:1px solid #111; z-index:1; }
        .knob.grey::after { z-index: 2; }

        /* Tombol Aksi / IN / AB */
        .btn-action {
            background-color: #62a87c;
            color: #111;
            border: 2px outset #82cc9e;
            font-size: 8px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 2px;
            cursor: pointer;
        }
        .btn-action.active {
            background-color: #3b6b4e;
            border-style: inset;
            color: #fff;
        }

        /* Deck Kontrol Media & File Loader */
        .media-deck {
            background: #253347;
            border: 2px solid #1a2433;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .deck-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .deck-row input[type="text"] {
            flex: 1;
            background: #111822;
            border: 1px solid #3c4f6b;
            color: #fff;
            padding: 5px 8px;
            border-radius: 3px;
            font-size: 11px;
        }
        .deck-row input[type="file"] {
            color: #d0d8e0;
            font-size: 11px;
        }
        .deck-row button {
            background: #4f6a90;
            color: white;
            border: 1px solid #6c8cb8;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
        }
        .deck-row button:hover { background: #6282b0; }
        audio { width: 100%; height: 32px; outline: none; margin-top: 2px; }
    </style>
</head>
<body>

<div class="plugin-container">
    <!-- Header -->
    <div class="sonnox-header">
        <span>Sonnox &nbsp;&nbsp;&nbsp;&nbsp; OXFORD EQ</span>
        <span style="letter-spacing: 0.5px;">XGS001DLMS by FR AUDIO — The Violet and White Essence of Sound</span>
        <span class="brand-right">Oxford Plugins :</span>
    </div>

    <!-- Layar Grafik Respon Frekuensi -->
    <div class="screen-container">
        <canvas id="eqCanvas" width="820" height="200"></canvas>
    </div>

    <!-- Baris Atas (LF Shelf, Master Trim/Type, HF Shelf) -->
    <div class="top-shelf-row">
        <!-- LF Filter Atas -->
        <div class="panel-module">
            <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:4px; align-items:center;">
                <div class="oct-box">6</div>
                <button class="btn-action active" id="lf-shelf-btn">/LF</button>
            </div>
            <div class="knob-row">
                <div class="knob-group">
                    <span class="label-text">FREQ</span>
                    <div class="knob grey" id="knob-lf-freq" data-min="20" data-max="250" data-val="60" data-step="1"></div>
                    <span class="knob-val" id="val-lf-freq">60 Hz</span>
                </div>
                <div class="knob-group">
                    <span class="label-text">Q</span>
                    <div class="knob grey" id="knob-lf-q" data-min="0.1" data-max="10" data-val="1.0" data-step="0.1"></div>
                    <span class="knob-val" id="val-lf-q">1.0</span>
                </div>
            </div>
        </div>

        <!-- Center Master Trim & A/B -->
        <div class="center-master-box">
            <div class="badge-type">TYPE 1</div>
            <div class="badge-over">OVER</div>
            <span style="font-size:8px; color:#111; font-weight:bold; margin-top:2px;">TRIM</span>
            <div class="knob-group" style="margin:0;">
                <div class="knob cyan" style="width:34px; height:34px;" id="knob-trim" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                <span class="knob-val" id="val-trim" style="font-size:7px;">0.0 dB</span>
            </div>
            <div style="display:flex; gap:4px; width:100%; justify-content:center; margin-top:2px;">
                <button class="btn-action active" style="padding:1px 5px;">A</button>
                <button class="btn-action" style="padding:1px 5px; background:#999;">B</button>
            </div>
        </div>

        <!-- HF Filter Atas -->
        <div class="panel-module">
            <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:4px; align-items:center;">
                <button class="btn-action active" id="hf-shelf-btn">HF\</button>
                <div class="oct-box">6</div>
            </div>
            <div class="knob-row">
                <div class="knob-group">
                    <span class="label-text">FREQ</span>
                    <div class="knob grey" id="knob-hf-freq" data-min="5000" data-max="20000" data-val="10000" data-step="50"></div>
                    <span class="knob-val" id="val-hf-freq">10K Hz</span>
                </div>
                <div class="knob-group">
                    <span class="label-text">Q</span>
                    <div class="knob grey" id="knob-hf-q" data-min="0.1" data-max="10" data-val="1.0" data-step="0.1"></div>
                    <span class="knob-val" id="val-hf-q">1.0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Baris Bawah (3 Panel Parametrik: LF Biru, MF Merah, HF Kuning) -->
    <div class="section-row">
        <!-- Panel 1: LF Parametric (Biru) -->
        <div class="panel-module">
            <div class="knob-row">
                <div class="knob-group">
                    <span class="label-text">FREQ</span>
                    <div class="knob blue" id="knob-p1-freq" data-min="40" data-max="400" data-val="100" data-step="1"></div>
                    <span class="knob-val" id="val-p1-freq">100 Hz</span>
                </div>
                <div class="knob-group">
                    <span class="label-text">Q</span>
                    <div class="knob blue" id="knob-p1-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>
                    <span class="knob-val" id="val-p1-q">1.4</span>
                </div>
            </div>
            <div class="knob-group" style="margin-top:4px;">
                <span class="label-text">GAIN</span>
                <div class="knob blue" id="knob-p1-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                <span class="knob-val" id="val-p1-gain">0.0 dB</span>
            </div>
            <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                <span style="font-size:9px; font-weight:bold; color:#111;">LF</span>
                <button class="btn-action active" style="font-size:7px; padding:2px 5px;">IN</button>
            </div>
        </div>

        <!-- Panel 2: MF Parametric (Merah) -->
        <div class="panel-module">
            <div class="knob-row">
                <div class="knob-group">
                    <span class="label-text">FREQ</span>
                    <div class="knob red" id="knob-p2-freq" data-min="200" data-max="5000" data-val="1000" data-step="10"></div>
                    <span class="knob-val" id="val-p2-freq">1K Hz</span>
                </div>
                <div class="knob-group">
                    <span class="label-text">Q</span>
                    <div class="knob red" id="knob-p2-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>
                    <span class="knob-val" id="val-p2-q">1.4</span>
                </div>
            </div>
            <div class="knob-group" style="margin-top:4px;">
                <span class="label-text">GAIN</span>
                <div class="knob red" id="knob-p2-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                <span class="knob-val" id="val-p2-gain">0.0 dB</span>
            </div>
            <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                <span style="font-size:9px; font-weight:bold; color:#111;">MF</span>
                <button class="btn-action active" style="font-size:7px; padding:2px 5px;">IN</button>
            </div>
        </div>

        <!-- Panel 3: HF Parametric (Kuning) -->
        <div class="panel-module">
            <div class="knob-row">
                <div class="knob-group">
                    <span class="label-text">FREQ</span>
                    <div class="knob yellow" id="knob-p3-freq" data-min="1000" data-max="16000" data-val="6000" data-step="10"></div>
                    <span class="knob-val" id="val-p3-freq">6K Hz</span>
                </div>
                <div class="knob-group">
                    <span class="label-text">OVERSHOOT</span>
                    <div class="knob yellow" id="knob-p3-q" data-min="0.1" data-max="10" data-val="1.4" data-step="0.1"></div>
                    <span class="knob-val" id="val-p3-q">1.4</span>
                </div>
            </div>
            <div class="knob-group" style="margin-top:4px;">
                <span class="label-text">GAIN</span>
                <div class="knob yellow" id="knob-p3-gain" data-min="-20" data-max="20" data-val="0" data-step="0.5"></div>
                <span class="knob-val" id="val-p3-gain">0.0 dB</span>
            </div>
            <div style="display:flex; justify-content:space-between; width:100%; margin-top:4px; align-items:center;">
                <span style="font-size:9px; font-weight:bold; color:#111;">HF</span>
                <button class="btn-action active" style="font-size:7px; padding:2px 5px;">IN</button>
            </div>
        </div>
    </div>

    <!-- Media Deck & DSP Audio Loader -->
    <div class="media-deck">
        <div class="deck-row">
            <input type="file" id="audioFile" accept="audio/*,video/*">
            <button id="playPauseBtn">PLAY / PAUSE AUDIO</button>
        </div>
        <div class="deck-row">
            <input type="text" id="ytUrlInput" placeholder="Masukkan URL YouTube atau Link Audio Stream...">
            <button id="loadStreamBtn">LOAD STREAM</button>
        </div>
        <audio id="audioElement" controls></audio>
    </div>
</div>

<script>
    // Arsitektur Web Audio API & DSP Real-time Engine
    let audioCtx = null;
    let sourceNode = null;
    let masterTrimNode = null;
    let filters = {};

    const canvas = document.getElementById('eqCanvas');
    const canvasCtx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    function initAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterTrimNode = audioCtx.createGain();
            masterTrimNode.gain.value = 1.0;

            // Inisialisasi 5 Filter Biquad Profesional
            filters['lf'] = audioCtx.createBiquadFilter();
            filters['lf'].type = 'lowshelf';

            filters['p1'] = audioCtx.createBiquadFilter();
            filters['p1'].type = 'peaking';

            filters['p2'] = audioCtx.createBiquadFilter();
            filters['p2'].type = 'peaking';

            filters['p3'] = audioCtx.createBiquadFilter();
            filters['p3'].type = 'peaking';

            filters['hf'] = audioCtx.createBiquadFilter();
            filters['hf'].type = 'highshelf';

            // Rantai Seri DSP: Source -> LF -> P1 -> P2 -> P3 -> HF -> MasterTrim -> Destination
            let keys = ['lf', 'p1', 'p2', 'p3', 'hf'];
            let prevKey = null;
            keys.forEach(k => {
                if (prevKey) filters[prevKey].connect(filters[k]);
                prevKey = k;
            });

            filters['hf'].connect(masterTrimNode);
            masterTrimNode.connect(audioCtx.destination);
        }
    }

    // Mapping knob ke parameter audio
    const knobMap = {
        'knob-lf-freq': { filter: 'lf', param: 'frequency', unit: 'Hz' },
        'knob-lf-q':    { filter: 'lf', param: 'Q', unit: '' },
        'knob-hf-freq': { filter: 'hf', param: 'frequency', unit: 'Hz' },
        'knob-hf-q':    { filter: 'hf', param: 'Q', unit: '' },
        'knob-trim':    { type: 'trim', unit: 'dB' },

        'knob-p1-freq': { filter: 'p1', param: 'frequency', unit: 'Hz' },
        'knob-p1-q':    { filter: 'p1', param: 'Q', unit: '' },
        'knob-p1-gain': { filter: 'p1', param: 'gain', unit: 'dB' },

        'knob-p2-freq': { filter: 'p2', param: 'frequency', unit: 'Hz' },
        'knob-p2-q':    { filter: 'p2', param: 'Q', unit: '' },
        'knob-p2-gain': { filter: 'p2', param: 'gain', unit: 'dB' },

        'knob-p3-freq': { filter: 'p3', param: 'frequency', unit: 'Hz' },
        'knob-p3-q':    { filter: 'p3', param: 'Q', unit: '' },
        'knob-p3-gain': { filter: 'p3', param: 'gain', unit: 'dB' }
    };

    // Fungsi interaksi putar knob dengan drag mouse
    document.querySelectorAll('.knob').forEach(knob => {
        let isDragging = false;
        let startY = 0;
        const id = knob.id;
        const cfg = knobMap[id];

        let min = parseFloat(knob.getAttribute('data-min'));
        let max = parseFloat(knob.getAttribute('data-max'));
        let val = parseFloat(knob.getAttribute('data-val'));
        let step = parseFloat(knob.getAttribute('data-step'));

        function applyKnobValue() {
            let percent = (val - min) / (max - min);
            let deg = percent * 270 - 135;
            knob.style.transform = `rotate(${deg}deg)`;

            let displayTxt = val;
            if (cfg.param === 'frequency' && val >= 1000) {
                displayTxt = (val / 1000).toFixed(val % 1000 !== 0 ? 1 : 0) + 'K';
            } else {
                displayTxt = val.toFixed(cfg.unit === 'dB' ? 1 : 1);
            }
            
            const valSpan = document.getElementById('val-' + id.replace('knob-', ''));
            if (valSpan) valSpan.textContent = displayTxt + ' ' + cfg.unit;

            // Terapkan ke Audio Context secara real-time
            if (audioCtx) {
                initAudioEngine();
                if (cfg.type === 'trim') {
                    masterTrimNode.gain.value = Math.pow(10, val / 20);
                } else if (cfg.filter && filters[cfg.filter]) {
                    filters[cfg.filter][cfg.param].value = val;
                }
                drawFrequencyCurve();
            }
        }

        applyKnobValue();

        knob.addEventListener('mousedown', (e) => {
            isDragging = true;
            startY = e.clientY;
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let deltaY = startY - e.clientY;
            startY = e.clientY;

            let range = max - min;
            val += (deltaY / 120) * range * 0.08;
            if (val < min) val = min;
            if (val > max) val = max;

            val = Math.round(val / step) * step;
            knob.setAttribute('data-val', val);
            applyKnobValue();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
    });

    // Menggambar Grafik Respon Frekuensi presisi ala Oxford EQ
    function drawFrequencyCurve() {
        canvasCtx.fillStyle = '#171f2e';
        canvasCtx.fillRect(0, 0, width, height);

        // Gambar Grid Vertikal (Frekuensi) & Horizontal (dB)
        canvasCtx.strokeStyle = '#23324a';
        canvasCtx.lineWidth = 1;

        const freqLines = [20, 40, 60, 100, 200, 400, 600, 1000, 2000, 4000, 6000, 10000];
        freqLines.forEach(f => {
            let x = (Math.log10(f / 20) / Math.log10(1000 / 20)) * width; // Skala logaritmik approx 20Hz-20kHz
            canvasCtx.beginPath(); canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x, height); canvasCtx.stroke();
        });

        for (let y = 0; y < height; y += 30) {
            canvasCtx.beginPath(); canvasCtx.moveTo(0, y); canvasCtx.lineTo(width, y); canvasCtx.stroke();
        }

        // Garis Center 0dB
        canvasCtx.strokeStyle = '#384d6b';
        canvasCtx.beginPath(); canvasCtx.moveTo(0, height / 2); canvasCtx.lineTo(width, height / 2); canvasCtx.stroke();

        // Label teks dB di sisi kiri/kanan layar grafik
        canvasCtx.fillStyle = '#8fa3c7';
        canvasCtx.font = '9px Arial';
        canvasCtx.fillText("20", 5, 15);
        canvasCtx.fillText("0", 5, height / 2 - 3);
        canvasCtx.fillText("-20", 5, height - 5);
        
        canvasCtx.fillText("20", width - 20, 15);
        canvasCtx.fillText("0", width - 15, height / 2 - 3);
        canvasCtx.fillText("-20", width - 25, height - 5);

        if (!audioCtx) return;

        // Kalkulasi Respons Filter
        const freqArray = new Float32Array(width);
        for (let i = 0; i < width; i++) {
            freqArray[i] = 20 * Math.pow(1000, i / width);
        }

        let totalMag = new Float32Array(width).fill(1.0);
        ['lf', 'p1', 'p2', 'p3', 'hf'].forEach(k => {
            const mag = new Float32Array(width);
            const phase = new Float32Array(width);
            filters[k].getFrequencyResponse(freqArray, mag, phase);
            for (let i = 0; i < width; i++) totalMag[i] *= mag[i];
        });

        // Gambar Kurva EQ Kuning
        canvasCtx.strokeStyle = '#e6d545';
        canvasCtx.lineWidth = 2.5;
        canvasCtx.beginPath();

        for (let i = 0; i < width; i++) {
            let db = 20 * Math.log10(Math.max(totalMag[i], 0.0001));
            let y = (height / 2) - (db * (height / 40));
            if (i === 0) canvasCtx.moveTo(i, y);
            else canvasCtx.lineTo(i, y);
        }
        canvasCtx.stroke();

        // Arsiran hijau transparan khas Oxford EQ di bawah kurva
        canvasCtx.lineTo(width, height);
        canvasCtx.lineTo(0, height);
        canvasCtx.fillStyle = 'rgba(46, 117, 79, 0.35)';
        canvasCtx.fill();
    }

    setTimeout(drawFrequencyCurve, 100);

    // Audio Player & File / Stream Handler
    const audioElement = document.getElementById('audioElement');
    const audioFileInput = document.getElementById('audioFile');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const loadStreamBtn = document.getElementById('loadStreamBtn');
    const ytUrlInput = document.getElementById('ytUrlInput');

    audioFileInput.addEventListener('change', function(e) {
        initAudioEngine();
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        audioElement.src = fileURL;

        if (sourceNode) {
            try { sourceNode.disconnect(); } catch(err) {}
        }

        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(filters['lf']);
        audioElement.play();
    });

    playPauseBtn.addEventListener('click', () => {
        initAudioEngine();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (audioElement.paused) audioElement.play();
        else audioElement.pause();
    });

    loadStreamBtn.addEventListener('click', () => {
        initAudioEngine();
        const url = ytUrlInput.value.trim();
        if (!url) {
            alert("Silakan masukkan URL atau link stream audio yang valid.");
            return;
        }
        audioElement.src = url;
        if (sourceNode) {
            try { sourceNode.disconnect(); } catch(err) {}
        }
        sourceNode = audioCtx.createMediaElementSource(audioElement);
        sourceNode.connect(filters['lf']);
        audioElement.play();
    });
</script>
</body>
</html>
