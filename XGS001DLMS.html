<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XGS001DLMS by FR AUDIO</title>
    <style>
        :root {
            --bg-color: #0d0a14;
            --panel-bg: #1a1525;
            --text-main: #ffffff;
            --violet-glow: #9d4edd;
            --violet-dark: #3c096c;
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* Header / Branding */
        header {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--violet-glow);
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
        }
        header p {
            color: var(--violet-glow);
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* 3D Panels */
        .panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            margin: 10px;
            box-shadow: 
                8px 8px 16px var(--shadow-dark), 
                -8px -8px 16px var(--shadow-light);
            border: 1px solid rgba(157, 78, 221, 0.2);
        }

        /* Glowing Screens */
        .screen {
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--violet-dark);
            box-shadow: 
                inset 0 0 20px rgba(157, 78, 221, 0.3),
                0 0 10px rgba(157, 78, 221, 0.5);
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Media Controls */
        .media-loader {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* 3D Buttons */
        .btn-3d {
            background: linear-gradient(145deg, #231c33, #1e172b);
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 
                4px 4px 8px var(--shadow-dark), 
                -4px -4px 8px var(--shadow-light);
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .btn-3d:active, .btn-3d.active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
            color: var(--violet-glow);
            text-shadow: 0 0 5px var(--violet-glow);
        }

        input[type="file"], input[type="text"] {
            background: #000;
            color: var(--violet-glow);
            border: 1px solid var(--violet-dark);
            padding: 8px;
            border-radius: 5px;
            outline: none;
        }

        /* Layout Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Controls / Sliders (3D styled ranges) */
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
        }
        .control-group label {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .val-display {
            font-family: monospace;
            color: var(--violet-glow);
            margin-top: 5px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--text-main);
            box-shadow: 0 0 10px var(--violet-glow);
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #000;
            border-radius: 3px;
            border: 1px solid var(--violet-dark);
        }

        /* VU Meters */
        .vu-container {
            display: flex;
            gap: 10px;
            height: 150px;
            justify-content: center;
            align-items: flex-end;
        }
        .vu-bar {
            width: 30px;
            height: 100%;
            background: #000;
            border: 1px solid var(--violet-dark);
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .vu-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, white, var(--violet-glow));
            box-shadow: 0 0 10px var(--violet-glow);
            transition: height 0.05s ease-out;
        }

        /* Video / YT Area */
        #mediaPlayer {
            width: 100%;
            max-height: 300px;
            outline: none;
        }
        #ytPlayer { display: none; width: 100%; height: 300px; border: none; }
    </style>
</head>
<body>

    <header>
        <h1>XGS001DLMS</h1>
        <p>by FR AUDIO — The Violet and White Essence of Sound</p>
    </header>

    <div class="panel" style="width: 100%; max-width: 1200px;">
        <div class="media-loader">
            <button class="btn-3d" id="initBtn">Power ON (Init Audio)</button>
            <input type="file" id="fileInput" accept="audio/*, video/*" title="Load Audio/Video">
            <input type="text" id="ytInput" placeholder="Paste YouTube Link Here...">
            <button class="btn-3d" id="loadYtBtn">Load YT</button>
        </div>

        <div class="screen" style="height: 320px;">
            <video id="mediaPlayer" controls crossorigin="anonymous"></video>
            <iframe id="ytPlayer" allowfullscreen></iframe>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <h3 style="text-align:center; margin-bottom: 20px; color: var(--violet-glow);">SUB / LOW CROSSOVER</h3>
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap;">
                <div class="control-group">
                    <label>HPF Freq (Hz)</label>
                    <input type="range" id="subHpf" min="20" max="100" value="30">
                    <div class="val-display" id="subHpfVal">30 Hz</div>
                </div>
                <div class="control-group">
                    <label>LPF Freq (Hz)</label>
                    <input type="range" id="subLpf" min="50" max="250" value="100">
                    <div class="val-display" id="subLpfVal">100 Hz</div>
                </div>
                <div class="control-group">
                    <label>Out Gain (dB)</label>
                    <input type="range" id="subGain" min="-24" max="12" value="0">
                    <div class="val-display" id="subGainVal">0.0 dB</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="btn-3d" id="subMute">MUTE SUB</button>
            </div>
        </div>

        <div class="panel">
            <h3 style="text-align:center; margin-bottom: 20px; color: var(--violet-glow);">MID / HIGH CROSSOVER</h3>
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap;">
                <div class="control-group">
                    <label>HPF Freq (Hz)</label>
                    <input type="range" id="midHpf" min="80" max="1000" value="100">
                    <div class="val-display" id="midHpfVal">100 Hz</div>
                </div>
                <div class="control-group">
                    <label>LPF Freq (Hz)</label>
                    <input type="range" id="midLpf" min="1000" max="20000" value="20000">
                    <div class="val-display" id="midLpfVal">20.0k Hz</div>
                </div>
                <div class="control-group">
                    <label>Out Gain (dB)</label>
                    <input type="range" id="midGain" min="-24" max="12" value="0">
                    <div class="val-display" id="midGainVal">0.0 dB</div>
                </div>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="btn-3d" id="midMute">MUTE MID/HIGH</button>
            </div>
        </div>
    </div>

    <div class="panel" style="width: 100%; max-width: 1200px;">
        <h3 style="text-align:center; margin-bottom: 20px;">MASTER OUTPUT</h3>
        <div class="screen vu-container">
            <div class="control-group" style="align-items: center; margin-right: 30px;">
                <div class="vu-bar"><div class="vu-fill" id="vuSubL"></div></div>
                <label style="margin-top: 10px;">SUB L</label>
            </div>
            <div class="control-group" style="align-items: center; margin-right: 30px;">
                <div class="vu-bar"><div class="vu-fill" id="vuSubR"></div></div>
                <label style="margin-top: 10px;">SUB R</label>
            </div>
            <div class="control-group" style="align-items: center; margin-right: 30px;">
                <div class="vu-bar"><div class="vu-fill" id="vuMidL"></div></div>
                <label style="margin-top: 10px;">MID L</label>
            </div>
            <div class="control-group" style="align-items: center;">
                <div class="vu-bar"><div class="vu-fill" id="vuMidR"></div></div>
                <label style="margin-top: 10px;">MID R</label>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Context
        let audioCtx;
        let source;
        let isInitialized = false;

        // Nodes
        const nodes = {};

        // DOM Elements
        const mediaPlayer = document.getElementById('mediaPlayer');
        const ytPlayer = document.getElementById('ytPlayer');

        // Initializer
        document.getElementById('initBtn').addEventListener('click', () => {
            if (isInitialized) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Core Routing
            source = audioCtx.createMediaElementSource(mediaPlayer);
            
            // Splitter
            const splitter = audioCtx.createChannelSplitter(2);
            source.connect(splitter);

            // Setup SUB Path
            nodes.subHpf = audioCtx.createBiquadFilter();
            nodes.subHpf.type = 'highpass';
            nodes.subLpf = audioCtx.createBiquadFilter();
            nodes.subLpf.type = 'lowpass';
            nodes.subGain = audioCtx.createGain();
            nodes.subAnalyserL = audioCtx.createAnalyser();
            nodes.subAnalyserR = audioCtx.createAnalyser();
            
            // Setup MID/HIGH Path
            nodes.midHpf = audioCtx.createBiquadFilter();
            nodes.midHpf.type = 'highpass';
            nodes.midLpf = audioCtx.createBiquadFilter();
            nodes.midLpf.type = 'lowpass';
            nodes.midGain = audioCtx.createGain();
            nodes.midAnalyserL = audioCtx.createAnalyser();
            nodes.midAnalyserR = audioCtx.createAnalyser();

            const merger = audioCtx.createChannelMerger(2);

            // Connect Source -> Splitter -> Filters (Mono to Stereo mix logic simplified for DLMS)
            source.connect(nodes.subHpf);
            nodes.subHpf.connect(nodes.subLpf);
            nodes.subLpf.connect(nodes.subGain);
            
            source.connect(nodes.midHpf);
            nodes.midHpf.connect(nodes.midLpf);
            nodes.midLpf.connect(nodes.midGain);

            // VU Meter connections
            nodes.subGain.connect(nodes.subAnalyserL);
            nodes.subGain.connect(nodes.subAnalyserR); // For true L/R you map splitter, here we simplify for demo
            nodes.midGain.connect(nodes.midAnalyserL);
            nodes.midGain.connect(nodes.midAnalyserR);

            // Master Out
            nodes.subGain.connect(audioCtx.destination);
            nodes.midGain.connect(audioCtx.destination);

            updateDSP();
            renderVU();
            
            isInitialized = true;
            document.getElementById('initBtn').classList.add('active');
            document.getElementById('initBtn').innerText = "POWER ON (READY)";
            audioCtx.resume();
        });

        // Event Listeners for UI
        const controls = [
            { id: 'subHpf', node: 'subHpf', param: 'frequency', suffix: ' Hz' },
            { id: 'subLpf', node: 'subLpf', param: 'frequency', suffix: ' Hz' },
            { id: 'subGain', node: 'subGain', param: 'gain', suffix: ' dB', isDb: true },
            { id: 'midHpf', node: 'midHpf', param: 'frequency', suffix: ' Hz' },
            { id: 'midLpf', node: 'midLpf', param: 'frequency', suffix: ' Hz' },
            { id: 'midGain', node: 'midGain', param: 'gain', suffix: ' dB', isDb: true }
        ];

        controls.forEach(ctrl => {
            const el = document.getElementById(ctrl.id);
            const disp = document.getElementById(ctrl.id + 'Val');
            el.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                // Update text display
                if(val >= 1000 && !ctrl.isDb) disp.innerText = (val/1000).toFixed(1) + 'k' + ctrl.suffix;
                else disp.innerText = val + ctrl.suffix;
                
                // Update DSP Node
                if (isInitialized) {
                    if (ctrl.isDb) {
                        // Convert dB to linear gain: 10^(dB/20)
                        nodes[ctrl.node][ctrl.param].value = Math.pow(10, val / 20);
                    } else {
                        nodes[ctrl.node][ctrl.param].value = val;
                    }
                }
            });
        });

        // Mute Buttons
        let subMuted = false, midMuted = false;
        document.getElementById('subMute').addEventListener('click', (e) => {
            subMuted = !subMuted;
            e.target.classList.toggle('active');
            if(isInitialized) nodes.subGain.gain.value = subMuted ? 0 : Math.pow(10, document.getElementById('subGain').value / 20);
        });
        document.getElementById('midMute').addEventListener('click', (e) => {
            midMuted = !midMuted;
            e.target.classList.toggle('active');
            if(isInitialized) nodes.midGain.gain.value = midMuted ? 0 : Math.pow(10, document.getElementById('midGain').value / 20);
        });

        function updateDSP() {
            controls.forEach(ctrl => { document.getElementById(ctrl.id).dispatchEvent(new Event('input')); });
        }

        // Media Loaders
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                mediaPlayer.src = objectUrl;
                mediaPlayer.style.display = 'block';
                ytPlayer.style.display = 'none';
                ytPlayer.src = '';
                if(isInitialized) audioCtx.resume();
                mediaPlayer.play();
            }
        });

        document.getElementById('loadYtBtn').addEventListener('click', () => {
            const ytUrl = document.getElementById('ytInput').value;
            const videoIdMatch = ytUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
            if (videoIdMatch && videoIdMatch[1]) {
                mediaPlayer.style.display = 'none';
                mediaPlayer.pause();
                ytPlayer.style.display = 'block';
                ytPlayer.src = `https://www.youtube.com/embed/${videoIdMatch[1]}?autoplay=1`;
                alert("YouTube dimuat. Catatan: Efek Crossover/DSP tidak diterapkan pada YouTube karena batasan keamanan browser (CORS). Gunakan file lokal untuk fitur DSP penuh.");
            } else {
                alert("Link YouTube tidak valid.");
            }
        });

        // VU Meter Animation Loop
        const vuData = new Uint8Array(1);
        function renderVU() {
            requestAnimationFrame(renderVU);
            if (!isInitialized) return;

            const updateBar = (analyser, elementId) => {
                analyser.getByteFrequencyData(vuData);
                const volume = vuData[0] / 255; 
                document.getElementById(elementId).style.height = (volume * 100) + '%';
            };

            updateBar(nodes.subAnalyserL, 'vuSubL');
            updateBar(nodes.subAnalyserR, 'vuSubR'); // Duplicated for aesthetic balance
            updateBar(nodes.midAnalyserL, 'vuMidL');
            updateBar(nodes.midAnalyserR, 'vuMidR');
        }
    </script>
</body>
</html>
