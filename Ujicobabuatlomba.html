<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web DLMS - YouTube Audio DSP Processor</title>
  <style>
    :root {
      --bg-dark: #12181b;
      --panel-bg: #1e262c;
      --accent-green: #00e676;
      --accent-blue: #00e5ff;
      --text-color: #e0e6ed;
      --border-color: #2a353d;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dlms-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h2, h3 {
      margin-top: 0;
      color: var(--accent-green);
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Video Player & Playlist Section */
    .video-container {
      width: 100%;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      height: 180px;
      display: block;
      object-fit: contain;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #141a1f;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
    }

    button {
      background: #2c3842;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-green);
      color: #000;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .playlist li {
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .playlist li.active {
      background: #2a3b47;
      color: var(--accent-blue);
      font-weight: bold;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }

    /* DSP Controls Section */
    .dsp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .fader-card {
      background: #151c21;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .fader-card label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--accent-blue);
    }

    .fader-card input[type="range"] {
      writing-mode: bt-lr;
      appearance: slider-vertical;
      width: 100%;
      height: 160px;
      background: #2a353d;
    }

    .val-display {
      font-size: 0.8rem;
      margin-top: 8px;
      display: block;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="dlms-container">
  <!-- Panel Kiri: Source & Playlist -->
  <div class="panel">
    <h2>YouTube Source</h2>
    
    <div class="video-container">
      <!-- Video Element berperan sebagai media element source -->
      <video id="ytAudioPlayer" controls crossorigin="anonymous"></video>
    </div>

    <div class="input-group">
      <input type="text" id="ytUrlInput" placeholder="Masukkan Link YouTube..." />
      <button onclick="tambahKePlaylist()">Load</button>
    </div>

    <div class="controls-row">
      <button onclick="prevTrack()">⏮ Prev</button>
      <button onclick="togglePlay()">⏯ Play/Pause</button>
      <button onclick="nextTrack()">Next ⏭</button>
    </div>

    <h3>Playlist Queue</h3>
    <ul class="playlist" id="playlistUI"></ul>
  </div>

  <!-- Panel Kanan: DLMS Audio Processing (DSP) -->
  <div class="panel">
    <h2>DLMS DSP Audio Processing</h2>
    <p style="font-size: 0.85rem; color: #888;">
      Sinyal audio dari YouTube diproses secara penuh melalui node <code>BiquadFilterNode</code> dan <code>GainNode</code> Web Audio API.
    </p>

    <div class="dsp-grid">
      <!-- High Pass Filter / Bass -->
      <div class="fader-card">
        <label>LOW (100Hz)</label>
        <input type="range" id="eqLow" min="-12" max="12" value="0" step="0.5" oninput="updateDSP()">
        <span class="val-display" id="valLow">0 dB</span>
      </div>

      <!-- Mid Filter -->
      <div class="fader-card">
        <label>MID (1kHz)</label>
        <input type="range" id="eqMid" min="-12" max="12" value="0" step="0.5" oninput="updateDSP()">
        <span class="val-display" id="valMid">0 dB</span>
      </div>

      <!-- High Filter / Treble -->
      <div class="fader-card">
        <label>HIGH (10kHz)</label>
        <input type="range" id="eqHigh" min="-12" max="12" value="0" step="0.5" oninput="updateDSP()">
        <span class="val-display" id="valHigh">0 dB</span>
      </div>

      <!-- Main Gain / Master Volume -->
      <div class="fader-card">
        <label>MASTER GAIN</label>
        <input type="range" id="masterGain" min="0" max="1.5" value="1" step="0.05" oninput="updateDSP()">
        <span class="val-display" id="valGain">0 dB</span>
      </div>
    </div>
  </div>
</div>

<script>
  // State Management
  let playlist = [];
  let currentIndex = -1;

  // Web Audio API Context & Nodes
  let audioCtx = null;
  let trackSource = null;
  let lowFilter = null;
  let midFilter = null;
  let highFilter = null;
  let gainNode = null;
  let isDSPConnected = false;

  const audioElement = document.getElementById('ytAudioPlayer');

  // 1. Inisialisasi Jalur Audio Processing (DSP)
  function initAudioDSP() {
    if (isDSPConnected) return;

    // Buat AudioContext baru saat ada gestur interaksi
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Buat media element source dari tag <video>
    trackSource = audioCtx.createMediaElementSource(audioElement);

    // Buat Equalizer & Gain Nodes
    lowFilter = audioCtx.createBiquadFilter();
    lowFilter.type = "lowshelf";
    lowFilter.frequency.value = 100;

    midFilter = audioCtx.createBiquadFilter();
    midFilter.type = "peaking";
    midFilter.frequency.value = 1000;
    midFilter.Q.value = 1;

    highFilter = audioCtx.createBiquadFilter();
    highFilter.type = "highshelf";
    highFilter.frequency.value = 10000;

    gainNode = audioCtx.createGain();

    // Hubungkan Node (Source -> Low -> Mid -> High -> Gain -> Output Speakers)
    trackSource
      .connect(lowFilter)
      .connect(midFilter)
      .connect(highFilter)
      .connect(gainNode)
      .connect(audioCtx.destination);

    isDSPConnected = true;
    console.log("Web Audio API DSP successfully connected to YouTube stream.");
  }

  // 2. Fungsi Load Stream Audio dari API backend
  async function loadYouTubeAudio(youtubeUrl) {
    try {
      // Mengambil stream URL via backend extractor
      const response = await fetch('/api/extract-audio', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: youtubeUrl })
      });

      const data = await response.json();

      if (data.streamUrl) {
        audioElement.crossOrigin = "anonymous";
        audioElement.src = data.streamUrl;

        // Pastikan AudioContext diinisialisasi & aktif
        if (!isDSPConnected) {
          initAudioDSP();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        await audioElement.play();
      } else {
        alert("Gagal mengambil stream audio/video dari URL YouTube!");
      }
    } catch (err) {
      console.error("Error loading stream:", err);
      alert("Terjadi kesalahan koneksi ke server extraction API.");
    }
  }

  // 3. Manajemen Playlist & Kontrol Player
  function tambahKePlaylist() {
    const input = document.getElementById('ytUrlInput');
    const url = input.value.trim();

    if (!url) return;

    playlist.push(url);
    input.value = '';
    renderPlaylist();

    // Jika belum ada lagu yang diputar, langsung putar lagu pertama
    if (currentIndex === -1) {
      playTrack(0);
    }
  }

  function renderPlaylist() {
    const ul = document.getElementById('playlistUI');
    ul.innerHTML = '';

    playlist.forEach((url, index) => {
      const li = document.createElement('li');
      li.className = index === currentIndex ? 'active' : '';
      li.innerHTML = `<span>Track #${index + 1}</span> <small>${url.substring(0, 25)}...</small>`;
      li.onclick = () => playTrack(index);
      ul.appendChild(li);
    });
  }

  function playTrack(index) {
    if (index >= 0 && index < playlist.length) {
      currentIndex = index;
      renderPlaylist();
      loadYouTubeAudio(playlist[currentIndex]);
    }
  }

  function togglePlay() {
    if (!audioElement.src) return;
    if (audioElement.paused) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audioElement.play();
    } else {
      audioElement.pause();
    }
  }

  function nextTrack() {
    if (currentIndex + 1 < playlist.length) {
      playTrack(currentIndex + 1);
    }
  }

  function prevTrack() {
    if (currentIndex - 1 >= 0) {
      playTrack(currentIndex - 1);
    }
  }

  // Otomatis lanjut ke track berikutnya ketika video/audio selesai
  audioElement.onended = () => {
    nextTrack();
  };

  // 4. Update Parameter DSP (Equalizer & Master Gain) Real-time
  function updateDSP() {
    const lowVal = parseFloat(document.getElementById('eqLow').value);
    const midVal = parseFloat(document.getElementById('eqMid').value);
    const highVal = parseFloat(document.getElementById('eqHigh').value);
    const gainVal = parseFloat(document.getElementById('masterGain').value);

    // Update Label UI
    document.getElementById('valLow').innerText = lowVal + " dB";
    document.getElementById('valMid').innerText = midVal + " dB";
    document.getElementById('valHigh').innerText = highVal + " dB";
    
    // Konversi gain linear ke dB untuk tampilan UI
    const dBGain = (20 * Math.log10(gainVal)).toFixed(1);
    document.getElementById('valGain').innerText = (gainVal === 0 ? "-∞" : dBGain) + " dB";

    // terapkan ke node Web Audio API jika sudah aktif
    if (isDSPConnected) {
      lowFilter.gain.value = lowVal;
      midFilter.gain.value = midVal;
      highFilter.gain.value = highVal;
      gainNode.gain.value = gainVal;
    }
  }
</script>

</body>
</html>
