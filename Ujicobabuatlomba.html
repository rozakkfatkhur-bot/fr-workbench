<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web DLMS - YouTube Audio DSP Processor</title>
  <style>
    :root {
      --bg-dark: #12181b;
      --panel-bg: #1e262c;
      --accent-green: #00e676;
      --accent-blue: #00e5ff;
      --text-color: #e0e6ed;
      --border-color: #2a353d;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dlms-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h2, h3 {
      margin-top: 0;
      color: var(--accent-green);
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Video Player & Playlist Section */
    .video-container {
      width: 100%;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      height: 180px;
      display: block;
      object-fit: contain;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #141a1f;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      outline: none;
    }

    button {
      background: #2c3842;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-green);
      color: #000;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .playlist li {
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .playlist li.active {
      background: #2a3b47;
      color: var(--accent-blue);
      font-weight: bold;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }

    /* DSP Controls Section */
    .dsp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .fader-card {
      background: #151c21;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fader-card label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--accent-blue);
    }

    .fader-card input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 100%;
      height: 160px;
      background: #2a353d;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    .val-display {
      font-size: 0.8rem;
      margin-top: 8px;
      display: block;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="dlms-container">
  <!-- Panel Kiri: Source & Playlist -->
  <div class="panel">
    <h2>YouTube Source</h2>
    
    <div class="video-container">
      <video id="ytAudioPlayer" controls crossorigin="anonymous"></video>
    </div>

    <div class="input-group">
      <input type="text" id="ytUrlInput" placeholder="Masukkan Link YouTube..." />
      <button onclick="tambahKePlaylist()">Load</button>
    </div>

    <div class="controls-row">
      <button onclick="prevTrack()">⏮ Prev</button>
      <button onclick="togglePlay()">⏯ Play/Pause</button>
      <button onclick="nextTrack()">Next ⏭</button>
    </div>

    <h3>Playlist Queue</h3>
    <ul class="playlist" id="playlistUI"></ul>
  </div>

  <!-- Panel Kanan: DLMS Audio Processing (DSP) -->
  <div class="panel">
    <h2>DLMS DSP Audio Processing</h2>
    <p style="font-size: 0.85rem; color: #888;">
      Sinyal audio dari YouTube diproses secara penuh melalui node <code>BiquadFilterNode</code> dan <code>GainNode</code> Web Audio API.
    </p>

    <div class="dsp-grid">
      <!-- High Pass Filter / Bass -->
      <div class="fader-card">
        <label>LOW (100Hz)</label>
        <input type="range" id="eqLow" min="-12" max="12" value="0" step="0.5" oninput="updateDSP()">
        <span class="val-display" id="valLow">0 dB</span>
      </div>

      <!-- Mid Filter -->
      <div class="fader-card">
        <label>MID (1kHz)</label>
        <input type="range" id="eqMid" min="-12" max="12" value="0" step="0.5" oninput="updateDSP()">
        <span class="val-display" id="valMid">0 dB</span>
      </div>

      <!-- High Filter / Treble -->
      <div class="fader-card">
        <label>HIGH (10kHz)</label>
        <input type="range" id="eqHigh" min="-12" max="12" value="0" step="0.5" oninput="updateDSP()">
        <span class="val-display" id="valHigh">0 dB</span>
      </div>

      <!-- Main Gain / Master Volume -->
      <div class="fader-card">
        <label>MASTER GAIN</label>
        <input type="range" id="masterGain" min="0" max="1.5" value="1" step="0.05" oninput="updateDSP()">
        <span class="val-display" id="valGain">0 dB</span>
      </div>
    </div>
  </div>
</div>

<script>
  // State Management
  let playlist = [];
  let currentIndex = -1;

  // Web Audio API Context & Nodes
  let audioCtx = null;
  let trackSource = null;
  let lowFilter = null;
  let midFilter = null;
  let highFilter = null;
  let gainNode = null;
  let isDSPConnected = false;

  const audioElement = document.getElementById('ytAudioPlayer');

  // 1. Inisialisasi Audio Processing (DSP Node)
  function initAudioDSP() {
    if (isDSPConnected) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    trackSource = audioCtx.createMediaElementSource(audioElement);

    lowFilter = audioCtx.createBiquadFilter();
    lowFilter.type = "lowshelf";
    lowFilter.frequency.value = 100;

    midFilter = audioCtx.createBiquadFilter();
    midFilter.type = "peaking";
    midFilter.frequency.value = 1000;
    midFilter.Q.value = 1;

    highFilter = audioCtx.createBiquadFilter();
    highFilter.type = "highshelf";
    highFilter.frequency.value = 10000;

    gainNode = audioCtx.createGain();

    // Rantai Audio: Source -> Low -> Mid -> High -> Gain -> Speakers
    trackSource
      .connect(lowFilter)
      .connect(midFilter)
      .connect(highFilter)
      .connect(gainNode)
      .connect(audioCtx.destination);

    isDSPConnected = true;
    console.log("Web Audio API DSP successfully connected.");
  }

  // Helper Sanitasi & Ekstrak Video ID
  function getYouTubeVideoId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  // 2. Ekstrak Stream Audio (Hybrid: Client API -> Serverless Fallback)
  async function loadYouTubeAudio(youtubeUrl) {
    const videoId = getYouTubeVideoId(youtubeUrl);
    if (!videoId) {
      alert("Link YouTube tidak valid!");
      return;
    }

    let directStreamUrl = null;

    // Tahap A: Coba beberapa endpoint Public Piped API langsung dari Browser
    const clientEndpoints = [
      `https://pipedapi.kavin.rocks/streams/${videoId}`,
      `https://api.piped.private.coffee/streams/${videoId}`,
      `https://pipedapi.mha.fi/streams/${videoId}`,
      `https://pipedapi.astrobot.me/streams/${videoId}`
    ];

    for (const endpoint of clientEndpoints) {
      try {
        const res = await fetch(endpoint, { signal: AbortSignal.timeout(3500) });
        if (res.ok) {
          const data = await res.json();
          const stream = data.audioStreams?.find(s => s.mimeType.includes('mp4') || s.mimeType.includes('webm')) 
                       || data.audioStreams?.[0];
          
          if (stream && stream.url) {
            directStreamUrl = stream.url;
            console.log("Stream berhasil dimuat dari Client Endpoint:", endpoint);
            break;
          }
        }
      } catch (e) {
        continue;
      }
    }

    // Tahap B: Jika Client API gagal/timeout, fallback ke Vercel Serverless Proxy
    if (!directStreamUrl) {
      console.warn("Client Endpoints gagal, beralih ke Serverless Proxy Vercel...");
      try {
        const response = await fetch('/api/extract-audio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: `https://www.youtube.com/watch?v=${videoId}` })
        });

        const data = await response.json();
        if (data.streamUrl) {
          directStreamUrl = data.streamUrl;
        }
      } catch (err) {
        console.error("Error loading via Vercel proxy:", err);
      }
    }

    // Tahap C: Playback dan Hubungkan ke AudioContext DSP
    if (directStreamUrl) {
      try {
        audioElement.crossOrigin = "anonymous";
        audioElement.src = directStreamUrl;

        if (!isDSPConnected) {
          initAudioDSP();
        }

        if (audioCtx && audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        updateDSP();
        await audioElement.play();
      } catch (playErr) {
        console.error("Playback Error:", playErr);
        alert("Gagal memutar audio stream.");
      }
    } else {
      alert("Gagal memuat stream: Semua server extractor sedang sibuk. Silakan coba lagu/link lain.");
    }
  }

  // 3. Kontrol Playlist & Playback
  function tambahKePlaylist() {
    const input = document.getElementById('ytUrlInput');
    const rawUrl = input.value.trim();

    if (!rawUrl) return;

    playlist.push(rawUrl);
    input.value = '';
    renderPlaylist();

    if (currentIndex === -1) {
      playTrack(0);
    }
  }

  function renderPlaylist() {
    const ul = document.getElementById('playlistUI');
    ul.innerHTML = '';

    playlist.forEach((url, index) => {
      const li = document.createElement('li');
      li.className = index === currentIndex ? 'active' : '';
      li.innerHTML = `<span>Track #${index + 1}</span> <small>${url.substring(0, 28)}...</small>`;
      li.onclick = () => playTrack(index);
      ul.appendChild(li);
    });
  }

  function playTrack(index) {
    if (index >= 0 && index < playlist.length) {
      currentIndex = index;
      renderPlaylist();
      loadYouTubeAudio(playlist[currentIndex]);
    }
  }

  function togglePlay() {
    if (!audioElement.src) return;

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (audioElement.paused) {
      audioElement.play();
    } else {
      audioElement.pause();
    }
  }

  function nextTrack() {
    if (currentIndex + 1 < playlist.length) {
      playTrack(currentIndex + 1);
    }
  }

  function prevTrack() {
    if (currentIndex - 1 >= 0) {
      playTrack(currentIndex - 1);
    }
  }

  audioElement.onended = () => {
    nextTrack();
  };

  // 4. Update Parameter DSP Real-time
  function updateDSP() {
    const lowVal = parseFloat(document.getElementById('eqLow').value);
    const midVal = parseFloat(document.getElementById('eqMid').value);
    const highVal = parseFloat(document.getElementById('eqHigh').value);
    const gainVal = parseFloat(document.getElementById('masterGain').value);

    // Update Display Label UI
    document.getElementById('valLow').innerText = lowVal + " dB";
    document.getElementById('valMid').innerText = midVal + " dB";
    document.getElementById('valHigh').innerText = highVal + " dB";
    
    const dBGain = gainVal === 0 ? "-∞" : (20 * Math.log10(gainVal)).toFixed(1);
    document.getElementById('valGain').innerText = dBGain + " dB";

    // Terapkan ke BiquadFilterNode & GainNode
    if (isDSPConnected) {
      lowFilter.gain.value = lowVal;
      midFilter.gain.value = midVal;
      highFilter.gain.value = highVal;
      gainNode.gain.value = gainVal;
    }
  }
</script>

</body>
</html>
