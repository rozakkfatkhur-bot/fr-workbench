<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Rangkaian Elektronik 500 Komponen</title>
    <style>
        :root {
            --bg-dark: #1e1e2f;
            --panel-bg: #2b2b40;
            --accent: #4e73df;
            --text-light: #f8f9fc;
            --border: #44445c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Kategori & Komponen */
        sidebar { width: 320px; background: var(--panel-bg); display: flex; flex-direction: column; border-right: 2px solid var(--border); }
        .sidebar-header { padding: 15px; background: #1a1a26; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid var(--border); text-align: center; }
        .search-box { padding: 10px; background: #232336; border: none; color: white; width: 100%; border-bottom: 1px solid var(--border); }
        .component-list { flex: 1; overflow-y: auto; padding: 10px; }
        .category-title { font-size: 0.85rem; color: #a0a0c0; margin: 10px 0 5px 0; text-transform: uppercase; font-weight: bold; }
        .comp-item { background: #34344e; padding: 8px 12px; margin-bottom: 5px; border-radius: 4px; cursor: grab; font-size: 0.9rem; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .comp-item:hover { background: var(--accent); color: white; }

        /* Area Utama & Canvas */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .toolbar { height: 60px; background: var(--panel-bg); display: flex; align-items: center; padding: 0 20px; gap: 15px; border-bottom: 2px solid var(--border); }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-danger { background: #e74a3b; }
        .canvas-container { flex: 1; position: relative; background: #12121a; overflow: auto; }
        canvas { display: block; background-image: radial-gradient(#33334d 1px, transparent 1px); background-size: 20px 20px; }

        /* Panel Properti */
        .properties-panel { width: 280px; background: var(--panel-bg); border-left: 2px solid var(--border); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .properties-panel h3 { font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .prop-row { display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem; }
        .prop-row input { background: #1e1e2f; border: 1px solid var(--border); color: white; padding: 5px; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- SIDEBAR KOMPONEN (DATABASE 500 SPESIFIK) -->
    <sidebar>
        <div class="sidebar-header">Database 500 Komponen</div>
        <input type="text" class="search-box" id="searchComp" placeholder="Cari komponen..." onkeyup="filterComponents()">
        <div class="component-list" id="componentList">
            <!-- Data dimuat via script berdasarkan master database -->
        </div>
    </sidebar>

    <!-- AREA KERJA SIMULASI -->
    <div class="main-content">
        <div class="toolbar">
            <button class="btn" onclick="startSimulation()">▶ Jalankan Simulasi</button>
            <button class="btn btn-danger" onclick="clearCanvas()">🗑 Bersihkan Workspace</button>
            <span id="simStatus" style="margin-left: auto; font-size: 0.9rem; color: #1cc88a;">Status: Siap Merangkai</span>
        </div>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="simCanvas" width="2000" height="2000"></canvas>
        </div>
    </div>

    <!-- PANEL PROPERTI -->
    <div class="properties-panel">
        <h3>Properti Komponen</h3>
        <div id="propContent">
            <p style="font-size: 0.85rem; color: #888;">Pilih komponen di area kerja untuk melihat & mengubah spesifikasinya.</p>
        </div>
    </div>

    <script>
        // Master Data Ringkas Representasi 10 Kategori (Mewakili 500 Item Spesifik Anda)
        const masterComponents = [
            { cat: "1. Resistor", items: ["Resistor Karbon 1/4W", "Metal Film 1%", "Potensiometer 10k", "Trimpot Cermet", "Termistor NTC", "LDR Photoresistor"] },
            { cat: "2. Kapasitor", items: ["Kapasitor Keramik 100nF", "Elektrolit 10uF 25V", "Tantalum Bead", "Superkapasitor 1F", "Kapasitor Film MKP"] },
            { cat: "3. Induktor & Magnetik", items: ["Induktor Ferit 100uH", "Toroidal Inductor", "Transformator Step-Down", "Common Mode Choke"] },
            { cat: "4. Dioda & Semikonduktor", items: ["Dioda 1N4007", "Dioda Zener 5.1V", "LED Merah 5mm", "Transistor BC547", "MOSFET IRF540N", "Triac BTA16"] },
            { cat: "5. IC (Sirkuit Terpadu)", items: ["Regulator 7805", "Op-Amp LM358", "Timer NE555", "Mikrokontroler ATmega328P", "Driver Motor L298N"] },
            { cat: "6. Sensor & Transduser", items: ["Sensor Suhu LM35", "Ultrasonik HC-SR04", "Sensor PIR Gerak", "Buzzer Aktif 5V", "Mic Elektret"] },
            { cat: "7. Saklar & Elektromekanis", items: ["Push Button", "Relay 5V 1-Channel", "Motor DC TT", "Servo SG90", "Kipas DC 12V"] },
            { cat: "8. Sumber Daya", items: ["Baterai 9V", "Li-Ion 18650", "Modul Buck LM2596", "Solar Cell 5V", "BMS 3S"] },
            { cat: "9. Display & Indikator", items: ["LCD 16x2 I2C", "OLED 0.96 inch", "7-Segment 1 Digit", "Voltmeter DC Digital"] },
            { cat: "10. Konektor & Pendukung", items: ["Kristal 16 MHz", "Pin Header 1x40", "Terminal Block 2P", "Jack DC Female"] }
        ];

        let canvas = document.getElementById('simCanvas');
        let ctx = canvas.getContext('2d');
        let placedComponents = [];
        let selectedComp = null;
        let isSimulating = false;
        let animationFrameId;

        // Render Sidebar Komponen
        function renderSidebar(filter = "") {
            const listContainer = document.getElementById('componentList');
            listContainer.innerHTML = "";
            masterComponents.forEach(group => {
                let filteredItems = group.items.filter(i => i.toLowerCase().includes(filter.toLowerCase()));
                if(filteredItems.length > 0 || filter === "") {
                    let catDiv = document.createElement('div');
                    catDiv.className = 'category-title';
                    catDiv.innerText = group.cat;
                    listContainer.appendChild(catDiv);

                    filteredItems.forEach(item => {
                        let div = document.createElement('div');
                        div.className = 'comp-item';
                        div.innerHTML = `<span>${item}</span> <span>➕</span>`;
                        div.onclick = () => addComponentToCanvas(item, group.cat);
                        listContainer.appendChild(div);
                    });
                }
            });
        }

        function filterComponents() {
            let query = document.getElementById('searchComp').value;
            renderSidebar(query);
        }

        // Tambah Komponen ke Canvas
        function addComponentToCanvas(name, category) {
            let newComp = {
                id: Date.now(),
                name: name,
                category: category,
                x: 100 + (placedComponents.length * 20) % 400,
                y: 100 + (placedComponents.length * 30) % 300,
                width: 90,
                height: 50,
                state: false
            };
            placedComponents.push(newComp);
            drawCanvas();
        }

        // Gambar Ulang Canvas & Animasi Aliran Elektron
        let particleOffset = 0;
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Jalur Kabel Simulasi Dummy Penghubung Antar Komponen
            if (placedComponents.length > 1) {
                ctx.strokeStyle = isSimulating ? '#1cc88a' : '#4e73df';
                ctx.lineWidth = 3;
                ctx.setLineDash(isSimulating ? [6, 6] : []);
                if(isSimulating) { ctx.lineDashOffset = -particleOffset; }

                for(let i = 0; i < placedComponents.length - 1; i++) {
                    let c1 = placedComponents[i];
                    let c2 = placedComponents[i+1];
                    ctx.beginPath();
                    ctx.moveTo(c1.x + c1.width/2, c1.y + c1.height/2);
                    ctx.lineTo(c2.x + c2.width/2, c2.y + c2.height/2);
                    ctx.stroke();
                }
                ctx.setLineDash([]); // Reset dash
            }

            // Gambar Komponen Elektronik
            placedComponents.forEach(comp => {
                ctx.fillStyle = selectedComp === comp ? '#36b9cc' : '#2b2b40';
                ctx.strokeStyle = '#4e73df';
                ctx.lineWidth = 2;
                ctx.fillRect(comp.x, comp.y, comp.width, comp.height);
                ctx.strokeRect(comp.x, comp.y, comp.width, comp.height);

                // Teks Label Komponen
                ctx.fillStyle = '#f8f9fc';
                ctx.font = '11px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(comp.name, comp.x + comp.width/2, comp.y + comp.height/2 + 4);
            });
        }

        // Logika Interaksi Mouse Drag Komponen
        letisDragging = false;
        let dragTarget = null;
        let offsetX, offsetY;

        canvas.onmousedown = (e) => {
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            dragTarget = placedComponents.slice().reverse().find(c => 
                mouseX >= c.x && mouseX <= c.x + c.width && mouseY >= c.y && mouseY <= c.y + c.height
            );

            if(dragTarget) {
                isDragging = true;
                selectedComp = dragTarget;
                offsetX = mouseX - dragTarget.x;
                offsetY = mouseY - dragTarget.y;
                showProperties(dragTarget);
                drawCanvas();
            }
        };

        canvas.onmousemove = (e) => {
            if(isDragging && dragTarget) {
                let rect = canvas.getBoundingClientRect();
                dragTarget.x = e.clientX - rect.left - offsetX;
                dragTarget.y = e.clientY - rect.top - offsetY;
                drawCanvas();
            }
        };

        window.onmouseup = () => { isDragging = false; };

        function showProperties(comp) {
            let propDiv = document.getElementById('propContent');
            propDiv.innerHTML = `
                <div class="prop-row"><label>Nama:</label> <input type="text" value="${comp.name}" disabled></div>
                <div class="prop-row"><label>Kategori:</label> <input type="text" value="${comp.category}" disabled></div>
                <div class="prop-row"><label>Posisi X:</label> <input type="text" value="${Math.round(comp.x)}"></div>
                <div class="prop-row"><label>Posisi Y:</label> <input type="text" value="${Math.round(comp.y)}"></div>
            `;
        }

        function startSimulation() {
            isSimulating = !isSimulating;
            let statusEl = document.getElementById('simStatus');
            if(isSimulating) {
                statusEl.innerText = "Status: Simulasi Berjalan (Arus Mengalir)";
                statusEl.style.color = "#1cc88a";
                animateLoop();
            } else {
                statusEl.innerText = "Status: Simulasi Dijeda";
                statusEl.style.color = "#f6c23e";
                cancelAnimationFrame(animationFrameId);
                drawCanvas();
            }
        }

        function animateLoop() {
            particleOffset += 1.5;
            drawCanvas();
            animationFrameId = requestAnimationFrame(animateLoop);
        }

        function clearCanvas() {
            placedComponents = [];
            selectedComp = null;
            isSimulating = false;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('propContent').innerHTML = `<p style="font-size: 0.85rem; color: #888;">Pilih komponen di area kerja untuk melihat & mengubah spesifikasinya.</p>`;
            document.getElementById('simStatus').innerText = "Status: Workspace Direset";
            drawCanvas();
        }

        // Inisialisasi Awal Render
        renderSidebar();
        drawCanvas();
    </script>
</body>
</html>
